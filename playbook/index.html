img{max-width:100%}[hidden]{display:none!important}

/* Same paint-chip look as the What's Next and When Playbooks, cut down to one page:
   six questions, each with the answer on the left and two drop-down menus on the right.
   The yellow date tab is the one loud element. A second view lists everything for printing. */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --sunk:#ECEAE4;
  --ink:#1A1B1E; --ink-2:#565962; --line:#DAD7CF;
  --brand:#F6B60D; --on-brand:#1A1B1E;
  --say:#FFF1BD; --say-line:#E6C552;
  --ok:#1B7447; --on-ok:#FFFFFF; --no:#B3261E;
  --focus:#1F5FBF; --shadow:rgba(26,27,30,.35);
  --chip:#2F3542; --on-chip:#FFFFFF;
  --warn-bg:#FBE9E7;
  --wordmark-size:1.5rem;
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131417; --surface:#1D1F23; --sunk:#282A30;
    --ink:#F2F1ED; --ink-2:#A9ACB3; --line:#383B42;
    --say:#3A3210; --say-line:#75631B;
    --ok:#5CC794; --on-ok:#0F2219; --no:#F28B82;
    --focus:#9CC2FF; --shadow:rgba(0,0,0,.7);
    --chip:#4A5266;
    --warn-bg:#3A1F1C;
    color-scheme:dark;
  }
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,p,ul,ol,dl,dd,dt{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:70rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.wordmark{min-width:0;font-family:var(--font-display);font-weight:700;font-size:var(--wordmark-size);letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.top-logo{display:block;flex:none;height:var(--wordmark-size);width:auto}

/* small labels, as in the playbooks */
.tag,.blk > h3,.pick > h3,.band-facts dt,.say-head h4,.plan-open h3{font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* band */
.band{background:var(--chip);color:var(--on-chip)}
.band-in{padding-block:22px 30px;display:grid;gap:14px}
.band h1{font-family:var(--font-display);font-weight:600;font-size:clamp(2.5rem,6.6vw,4.25rem);line-height:.98;text-wrap:balance}
.band-facts{display:grid;gap:14px 32px;border-top:1px solid currentColor;padding-top:16px;margin-top:6px}
@media (min-width:48rem){.band-facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.band-facts dt{margin-bottom:3px}
.band-facts dd{font-size:1.06rem;line-height:1.4}

.page{padding-block:30px 56px;display:grid;gap:44px}

/* how to use it */
.how{display:grid;gap:18px}
.steps{display:grid;border-top:2px solid var(--ink)}
.steps li{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps .n{grid-row:span 2;font-family:var(--font-display);font-weight:700;font-size:2.1rem;line-height:1;color:var(--ink-2)}
.steps b{font-size:1.14rem;line-height:1.3}
.steps .d{color:var(--ink-2)}
@media (min-width:48rem){
  .steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px}
  .steps li{border-bottom:0;padding:14px 0 0}
}
.start{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.start-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.fld{display:grid;gap:4px;min-width:0}
.fld.grow{flex:1 1 16rem}
.fld label{font-weight:600}
.fld input{width:100%;min-height:2.75rem;background:var(--bg);border:1.5px solid var(--ink);border-radius:6px;padding:8px 12px;font-weight:600}
.fld input::placeholder{color:var(--ink-2);font-weight:400;opacity:1}
.fld select{width:100%;min-height:2.75rem;background:var(--bg);border:1.5px solid var(--ink);border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer}
.fld.play{flex:1 1 19rem}
.start-row .pill{min-height:2.75rem}
.hint{color:var(--ink-2);font-size:.97rem;line-height:1.4}

.mv{display:inline-block;margin-right:8px;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:.08em}
.mv.yes{background:var(--ok);color:var(--on-ok)}
.mv.no{background:var(--warn-bg);color:var(--no);box-shadow:inset 0 0 0 1px var(--no)}

.pill{flex:none;border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 15px;font-size:.95rem;font-weight:600;cursor:pointer;min-height:2.4rem}
.pill:hover{background:var(--ink);color:var(--bg)}
.pill.sm{padding:3px 13px;font-size:.88rem;min-height:0}
.pill.solid{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill.solid:hover{background:var(--brand);color:var(--on-brand);filter:brightness(.93)}

/* download buttons */
.dl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.dl-hint{flex-basis:100%;font-size:.95rem}
.band .dl{margin-top:6px}
.band .pill:not(.solid){border-color:currentColor}
.band .pill:not(.solid):hover{background:var(--on-chip);color:var(--chip)}
.all-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}

/* start from your documents */
.upload{display:grid;gap:14px;background:var(--surface);border:2px dashed var(--ink-2);border-radius:8px;padding:20px}
.upload.over{border-color:var(--ink);background:var(--say)}
.up-head{display:grid;gap:4px}
.up-head h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.75rem,3.6vw,2.25rem);line-height:1.06}
.up-head p{font-size:1.1rem;max-width:44rem}
.up-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.up-input{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
.upload .pill{min-height:2.75rem;padding-inline:20px;font-size:1.02rem}
.upload .pill:disabled{opacity:.5;cursor:default;pointer-events:none}
.up-list{display:grid;border-top:1px solid var(--line)}
.up-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.up-name{font-weight:600;overflow-wrap:anywhere}
.up-kind{grid-column:1;color:var(--ink-2);font-size:.97rem}
.up-kind.bad{color:var(--no)}
.up-x{grid-column:2;grid-row:1 / span 2;background:none;border:0;padding:6px 0;color:var(--ink-2);font-size:.95rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.up-x:hover{color:var(--ink)}
.up-x:disabled{opacity:.5;cursor:default}
.up-need{font-weight:600}
.up-status{display:flex;align-items:baseline;gap:10px;font-weight:600;font-size:1.06rem}
.up-status.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--no);border-radius:6px;padding:10px 14px;font-weight:400}
.up-status.ok{background:var(--say);border:1px solid var(--say-line);border-radius:6px;padding:10px 14px;font-weight:400}
.up-dot{flex:none;width:.7rem;height:.7rem;border-radius:50%;background:var(--brand);box-shadow:0 0 0 1.5px var(--ink);animation:up-pulse 1.2s ease-in-out infinite}
@keyframes up-pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.up-dot{animation:none}}

/* note on a playbook Claude wrote from uploaded documents */
.written{display:grid;gap:8px;background:var(--say);border:1px solid var(--say-line);border-left:6px solid var(--brand);border-radius:0 6px 6px 0;padding:14px 18px}
.written-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:2px}

/* one question */
.qs{display:grid;gap:48px}
.q{display:grid;gap:20px;border-top:2px solid var(--ink);padding-top:20px}
.q-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.qnum{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--chip);color:var(--on-chip);font-family:var(--font-display);font-weight:700;font-size:1.55rem;line-height:1}
.qnum.done{background:var(--ok);color:var(--on-ok)}
.q-head h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.75rem,3.6vw,2.25rem);line-height:1.06;text-wrap:balance;padding-top:.12rem}
.q-grid{display:grid;gap:22px;min-width:0}
@media (min-width:60rem){.q-grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:44px;align-items:start}}

.q-know{display:grid;gap:18px;min-width:0}
.blk{display:grid;gap:5px;min-width:0}
.blk > h3{color:var(--ink-2)}
.blk.ans{background:var(--surface);border-left:5px solid var(--chip);border-radius:0 6px 6px 0;padding:14px 16px 16px}
.answer{font-size:1.18rem;line-height:1.45}
.blk.ans textarea{display:block;width:100%;min-height:5.2rem;resize:none;overflow:hidden;background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:2px 0 8px;font-size:1.18rem;line-height:1.45}
.blk.ans textarea:hover,.blk.ans textarea:focus{border-bottom-color:var(--ink)}
.blk.ans textarea::placeholder{color:var(--ink-2);opacity:1}
.blk.unknown > h3{color:var(--no)}

.q-do{display:grid;gap:22px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.pick{display:grid;gap:8px;min-width:0}
.pick > h3{color:var(--ink-2)}

/* drop-down menu */
.dd{position:relative;min-width:0}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:3.4rem;text-align:left;background:var(--bg);border:1.5px solid var(--ink);border-radius:6px;padding:10px 16px;font-weight:600;font-size:1.1rem;line-height:1.3;cursor:pointer}
.dd-btn:hover{background:var(--sunk)}
.dd-btn:disabled{cursor:default;border-color:var(--line);color:var(--ink-2);background:var(--sunk);font-weight:400}
.dd.is-set .dd-btn{background:var(--surface);box-shadow:inset 6px 0 0 var(--brand);padding-left:20px}
.dd-val{min-width:0}
.dd-chev{flex:none;width:.62rem;height:.62rem;margin:0 4px 4px 0;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s ease}
.dd.open .dd-chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.dd-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);display:grid;gap:2px;background:var(--surface);border:1.5px solid var(--ink);border-radius:6px;box-shadow:0 18px 32px -14px var(--shadow);padding:6px}
.dd-opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 12px;align-items:start;width:100%;text-align:left;background:transparent;border:0;border-radius:4px;padding:11px 12px;cursor:pointer;font-size:1.06rem;line-height:1.3}
.dd-opt:hover,.dd-opt:focus-visible{background:var(--sunk)}
.dd-opt[aria-selected="true"]{background:var(--say)}
.dd-n{grid-row:span 2;display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--chip);color:var(--on-chip);font-size:.9rem;font-weight:700}
.dd-t{grid-column:2;font-weight:600}
.dd-d{grid-column:2;color:var(--ink-2);font-size:.95rem}
.dd-opt.plain{grid-template-columns:minmax(0,1fr)}
.dd-opt.plain .dd-t,.dd-opt.plain .dd-d{grid-column:1}

.detail{display:grid;gap:8px;min-width:0}
.detail:empty{display:none}
.by b{font-weight:700}
.note{color:var(--ink-2)}

/* the date tab */
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;padding-top:4px}
.opt-body{display:grid;gap:10px;min-width:0}
.put{font-size:1.14rem;line-height:1.35}
.cal{flex:none;width:5.6rem;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--surface);text-align:center;line-height:1}
.cal span{display:block}
.cal-wd{background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:5px 0}
.cal-day{font-family:var(--font-display);font-weight:700;font-size:3.1rem;padding:6px 0 0}
.cal-mo{font-size:.88rem;font-weight:600;padding:3px 0 9px}
.cal.on{background:var(--brand);color:var(--on-brand)}
.cal.sm{width:4.6rem}
.cal.sm .cal-day{font-size:2.4rem;padding-top:4px}
.cal.sm .cal-mo{font-size:.8rem;padding-bottom:7px}

.say{background:var(--say);border:1px solid var(--say-line);border-radius:6px;padding:10px 14px 13px;display:grid;gap:4px}
.say-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.say-text{font-size:1.12rem;line-height:1.42}

/* the calendar built from the choices */
.plan{display:grid;gap:16px;border-top:2px solid var(--ink);padding-top:20px}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
.plan-head h2{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,4vw,2.5rem);line-height:1.05}
.plan-count{color:var(--ink-2)}
#plan-body{display:grid;gap:16px}
.plan-actions{display:flex;flex-wrap:wrap;gap:8px}
.plan-days{display:grid;border-top:1px solid var(--line)}
.plan-day{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.plan-items{display:grid;gap:12px;padding-top:2px}
.plan-items li{display:grid;gap:1px}
.plan-items b{font-size:1.14rem;line-height:1.3}
.plan-ctx{color:var(--ink-2);font-size:.97rem}
.plan-open{display:grid;gap:6px}
.plan-open h3{color:var(--ink-2)}
.plan-open li{position:relative;padding-left:1.5rem}
.plan-open li::before{content:"";position:absolute;left:.4rem;top:.66em;width:6px;height:6px;border-radius:50%;background:var(--ink-2)}
.plan-foot{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center}
.reset,.textlink{background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:.95rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.reset:hover,.textlink:hover{color:var(--ink)}

/* footer */
.foot{border-top:1px solid var(--line)}
.foot-in{display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap;padding-block:18px;color:var(--ink-2);font-size:.92rem}
.foot-txt{display:grid;gap:2px;max-width:46rem}
.logo{display:block;height:28px;width:auto;margin-left:auto}

@media (max-width:26rem){
  .opt{grid-template-columns:minmax(0,1fr)}
  .q-do{padding:14px}
}
@media (prefers-reduced-motion: reduce){.dd-chev{transition:none}}

/* ── everything on one page: every suggestion and option, for reading and printing ── */
.all{max-width:54rem;padding-block:24px 56px;font-size:1rem;line-height:1.4}
.all > * + *{margin-top:1.25rem}
.all-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px}
.all-bar a{font-weight:600;text-underline-offset:3px;color:inherit}
.a-brand{display:none}
.a-tag,.a-facts dt,.all h5{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.a-cover{background:var(--chip);color:var(--on-chip);padding:1.67rem 2.08rem 1.9rem;border-radius:.42rem}
.a-cover h1{font-family:var(--font-display);font-weight:600;font-size:3.54rem;line-height:1;margin-top:.62rem;text-wrap:balance}
.a-facts{display:grid;gap:.9rem 2.08rem;border-top:1px solid currentColor;margin-top:1.46rem;padding-top:1.04rem}
@media (min-width:40rem){.a-facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.a-facts dd{font-size:1.02rem;line-height:1.35;margin-top:.2rem}
.a-intro > * + *{margin-top:1.25rem}
.a-steps{display:grid;gap:.6rem 2.08rem;border-top:2px solid var(--ink);padding-top:.94rem}
@media (min-width:40rem){.a-steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.a-steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 .83rem}
.a-steps .n{grid-row:span 2;font-family:var(--font-display);font-weight:700;font-size:2.3rem;line-height:1;color:var(--ink-2)}
.a-steps b{font-size:1.1rem;line-height:1.25}
.a-steps .d{color:var(--ink-2)}
.a-start{background:var(--sunk);border-radius:.42rem;padding:.94rem 1.25rem}
.all .a-stamp{color:var(--ink-2);font-size:.86rem;margin-top:.62rem}

.all .a-q{margin-top:1.9rem}
.a-q > * + *,.a-qtop > * + *{margin-top:1.04rem}
.a-qtop{break-inside:avoid;break-after:avoid}
.a-qhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.15rem;align-items:start;border-top:2px solid var(--ink);padding-top:1.15rem}
.a-qnum{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--chip);color:var(--on-chip);font-family:var(--font-display);font-weight:700;font-size:1.56rem;line-height:1}
.a-qhead h2{font-family:var(--font-display);font-weight:700;font-size:1.98rem;line-height:1.08;padding-top:.1rem;text-wrap:balance}
.a-know > * + *{margin-top:.83rem}
.a-know h5{color:var(--ink-2);margin-bottom:.1rem}
.a-know .a-ans{border-left:.42rem solid var(--chip);padding:.1rem 0 .2rem 1.04rem}
.a-know .a-ans p{font-size:1.12rem;white-space:pre-wrap;overflow-wrap:anywhere}
.a-know .a-unknown h5{color:var(--no)}
.a-lines{display:block;height:4.6rem;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.5rem - 1px),var(--line) calc(1.5rem - 1px),var(--line) 1.5rem)}

.a-sug{border:1px solid var(--line);border-radius:.42rem;background:var(--surface)}
.a-sughead{break-inside:avoid;break-after:avoid;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.04rem;align-items:start;background:var(--sunk);border-radius:.42rem .42rem 0 0;padding:.73rem 1.25rem}
.a-sugn{display:grid;place-items:center;width:1.77rem;height:1.77rem;border-radius:50%;background:var(--chip);color:var(--on-chip);font-size:.94rem;font-weight:700;margin-top:.1rem}
.a-sughead h3{font-family:var(--font-display);font-weight:700;font-size:1.51rem;line-height:1.1}
.a-why{margin-top:.2rem}
.a-by{text-align:right;color:var(--ink-2);font-size:.82rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.a-by b{display:block;color:var(--ink);font-size:1.02rem;letter-spacing:0;text-transform:none}
@media (max-width:40rem){.a-sughead{grid-template-columns:auto minmax(0,1fr)}.a-by{grid-column:2;text-align:left;white-space:normal}.a-by b{display:inline;margin-left:.45rem}.a-cover{padding:1.25rem 1.25rem 1.4rem}.a-cover h1{font-size:2.6rem}}
.a-o{break-inside:avoid;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.15rem;align-items:start;padding:.62rem 1.25rem;border-top:1px solid var(--line)}
.a-o h4{font-size:1.06rem;font-weight:700;line-height:1.25}
.a-obody > * + *{margin-top:.2rem}
.a-chosen{display:inline-block;margin-left:.6rem;padding:0 .6rem;border-radius:999px;background:var(--ok);color:var(--on-ok);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:.12em}
.a-say{background:var(--say);border:1px solid var(--say-line);border-radius:.3rem;padding:.42rem .83rem}
.a-cal{display:block;width:4.17rem;border:1px solid var(--ink);border-radius:.3rem;overflow:hidden;background:var(--brand);color:var(--on-brand);text-align:center;line-height:1}
.a-cal span{display:block}
.a-wd{background:var(--ink);color:var(--bg);font-size:.69rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.26rem 0}
.a-day{font-family:var(--font-display);font-weight:700;font-size:1.875rem;padding-top:.26rem}
.a-mo{font-size:.69rem;font-weight:600;padding:.16rem 0 .36rem}
.a-cal.wr{width:4.9rem;background:var(--surface);color:var(--ink-2)}
.a-cal.wr .a-wd{letter-spacing:.05em}
.a-write{height:1.9rem}

@media print{
  :root{--bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F3F2EE;--ink:#1A1B1E;--ink-2:#565962;--line:#DAD7CF;--say:#FFF1BD;--say-line:#E6C552;--chip:#2F3542;--no:#B3261E;--ok:#1B7447;--on-ok:#FFFFFF;--warn-bg:#FBE9E7;--on-chip:#FFFFFF}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html{font-size:9.6pt}
  .pill,.reset,.textlink,.plan-actions,.detail .hint,.dd-list,.dd-chev,.all-bar,.dl,#d0-note,.upload,.written-acts{display:none!important}
  .dd-btn{min-height:0;border:0;padding:0!important;background:none!important;box-shadow:none!important;font-size:1.1em}
  .dd-btn:disabled{display:none}
  .fld input,.fld select{border:0;padding:0;min-height:0;background:none;appearance:none}
  .blk.ans textarea{border:0}
  .q,.plan-day,.say,.opt{break-inside:avoid}
  .page{gap:26px}.qs{gap:26px}
  body.view-all .top,body.view-all .foot{display:none}
  .all{max-width:none;padding:0}
  .a-brand{display:flex;justify-content:space-between;align-items:center;gap:16px}
  .a-brand img{height:1.6rem;width:auto}
  html.pdf .a-brand{display:none}
  .a-sug{background:none}
}

</style>
</head>
<body>
<header class="top">

"use strict";
/* MASTER: the six questions and the standard suggestions and options, worded for any job. */
const MASTER={"version":5,"pageTitle":"What’s Next and When: Master Questionnaire Action Playbook","tag":"Master questionnaire action playbook","h1":"From six answers to dates on your calendar","facts":[["Use it for","Any open commercial job over $20,000."],["Have ready","The completed CSA questionnaire and the proposal."],["You leave with","A next step and a calendar date for each answer."]],"priceDays":60,"questions":[{"q":"What is the project, scope and estimate amount?","check":"In the proposal: every price, what is optional, any saving for doing it all at once, and the proposal date.","often":"Whether the price still stands. Most proposals are valid for 60 days.","suggestions":[{"t":"Check that the price still stands","why":"Find the proposal date. A price more than 60 days old goes to the Owner. So does a job over $75,000 that a board or a general contractor awards.","src":"Review the job, step 5: Choose your next move","options":[{"t":"Keep the price and set a new end date","d":1,"do":"The Owner keeps the price and sets a new date it holds until. Write that date on the proposal and tell your contact."},{"t":"Reprice and send a new proposal","d":3,"do":"The Owner updates the costs. Send a new proposal with a new date. Tell your contact before it arrives, so a changed number is not a surprise."},{"t":"Keep the first part’s price, estimate the rest","d":2,"do":"Keep the price firm for the part the customer is deciding on now. Give the rest as budget figures, with the date you will confirm final pricing.","say":"Here are the figures for [the later work]. They are valid until [date]. After that we will confirm updated pricing before you approve the work."}]},{"t":"Offer a smaller first step","why":"When budget or timing is the real problem, a smaller first piece is easier to approve. Take work out before you take dollars out. Give the customer one number and one page to decide on.","src":"They are waiting for approval, step 4: Provide only the missing help","options":[{"t":"Confirm with your contact which part goes first","d":2,"do":"Their answer is your first step. Write down the part and the reason.","say":"If you had to stand up and defend this, which part could you defend today? Why that part?"},{"t":"Write a one-page summary of the first step","d":5,"do":"One page your contact can hand to whoever decides: why this part first, why now, the price, and the rest shown as later phases."},{"t":"Send a new proposal for the first step only","d":5,"do":"The first part is the whole scope and the total. The rest moves to a short phase plan. Get the Owner’s price decision first."}]},{"t":"Show the whole job on one page","why":"A proposal often holds more than one price: parts, optional items, a saving for doing it all at once. Make the choices easy to compare.","src":"I have not sent the proposal, step 4: Make the proposal easy to compare","options":[{"t":"Put the totals side by side","d":3,"do":"Show the price of each part on its own and the price of everything together. The customer can see what each choice costs."},{"t":"Lay the parts out by date","d":5,"do":"The first part now. The rest in the months or years the customer chooses, each with its price and the date that price holds until."},{"t":"List the optional items as yes or no lines","d":3,"do":"Give each optional item its own line with its price and one sentence on why it is there. Let the customer say yes or no to each."}]}]},{"q":"What did the customer say or do in the last meaningful conversation, and when?","check":"In your notes: the customer’s own words, and the date of that call, visit or email.","often":"When it happened. “Recently” and “regularly” are not dates.","suggestions":[{"t":"Ask where it stands","why":"What the customer last said tells you how they feel about the job. It may not tell you where the decision sits. Ask, and make it easy to tell you the truth.","src":"They are waiting for approval, step 2: Ask where the approval stands","options":[{"t":"Call your contact this week","d":2,"do":"Call. Do not wait for them to call you.","say":"Thanks for the update. Can I ask where it sits right now? Have the people who decide had a chance to look at it, or is it still waiting for a slot?"},{"t":"Ask at your next planned contact","d":10,"do":"Use this when you already talk on a regular schedule. If the date passes with no contact, call.","say":"What approval is still needed, and is there anything missing that we can help with?"},{"t":"Send one short question in writing","d":1,"do":"A note they can answer in one line.","say":"Quick question so I can plan: have the people who decide seen the proposal yet, or is it still waiting for a meeting?","sayKind":"Write this"}]},{"t":"Find out what is behind what they said","why":"The first thing a customer says is rarely the whole problem. “Too high”, “next year” and “waiting on approval” each need a different move. Ask before you answer.","src":"Five simple habits: Ask before deciding","options":[{"t":"They said the price is too high","d":2,"do":"Find out if it is another bid or a budget limit. Each needs a different answer. Bring no new price to this call.","say":"Is the issue the other price or a budget limit? What matters most to you that we need to protect?"},{"t":"They said later, or next year","d":5,"do":"Two dates may come back: when your numbers are due, and when the budget is approved. Write down both.","say":"When do you need our figures for the budget, and when is that budget normally approved?"},{"t":"They said it is waiting on someone","d":2,"do":"Find out who still has to say yes and what that person needs.","say":"What will the people who decide need to feel comfortable approving this?"}]},{"t":"Write down when it happened","why":"The question asks when. Without a date you can’t tell how current the news is.","src":"Review the job, step 1: Gather facts","options":[{"t":"Add the date to the questionnaire","d":0,"do":"Check your call history, email or calendar. Write the date of that conversation next to the answer."},{"t":"Start a contact log for this job","d":1,"do":"After each call or visit, write the date, what the customer said in their own words, and what they said happens next."},{"t":"Set a two-week reminder","d":10,"do":"If the reminder comes up and nothing has changed, contact them with a useful question. Skip “just checking in.”"}]}]},{"q":"Why is the customer doing the project, and why now?","check":"In the proposal: the conditions it describes, the photos, and anything called failing or urgent.","often":"Why now. A need that has been there for years does not explain why they would act this time.","suggestions":[{"t":"Give your contact the “why now”","why":"A real need can still wait another year. Whoever approves the money will ask why now. Help your contact answer.","src":"They are waiting for approval, step 3: Find what the approver needs","options":[{"t":"Make a photo page of the worst areas","d":3,"do":"Use the photos in the proposal and your own site photos. Label each one by area."},{"t":"List what waiting changes","d":3,"do":"In plain words, from the proposal and what you saw on site. Leave out dollar figures you can’t back up."},{"t":"Ask what people say about the property today","d":2,"do":"Use their words on the page, not yours.","say":"What do the people who use the property say about it today?"}]},{"t":"Put the work in order of need","why":"When the whole job can’t go at once, the first part has to be one the customer can defend. Ranking the areas with your contact gives them the reason for the order.","src":"They are waiting for approval, step 7: Make the next job easier","options":[{"t":"Walk the site with your contact","d":10,"do":"Rank the areas together on site and take photos as you go."},{"t":"Rank them from your notes and send it","d":3,"do":"Use your site notes and photos. Ask your contact to confirm or correct the order."},{"t":"Ask by phone","d":2,"do":"Write down the order and the reasons.","say":"Which area is in the worst shape, and which would you do first?"}]},{"t":"Show how much lead time the job needs","why":"Crews and equipment take time to line up. That is an honest reason to decide sooner. Put a number on it.","src":"They need a firm finish date, step 4: Build the schedule with production","options":[{"t":"Ask what start date they have in mind","d":2,"do":"That date is theirs. If they do not know, write UNKNOWN.","say":"If this is approved, when would you want the work to start?"},{"t":"Get the lead time from production","d":2,"do":"Ask the Owner or production how many weeks they need from approval to start. Promise no start date until they have checked it."},{"t":"Add a “decide by” line to your summary","d":5,"do":"Once you have both, write: to start in [their window], we need approval by [date]. Call it your planning date, not the customer’s."}]}]},{"q":"Who is the primary contact, who decides, and who else matters?","check":"In the proposal: who it is addressed to, and whether that person is the one who decides.","often":"Who else has a say, how many have to agree, and who signs.","suggestions":[{"t":"Learn who decides and how","why":"You can know your contact well and still not know who else has a say. Find out how many people decide and what a yes takes.","src":"I have not sent the proposal, step 3: Ask how they will decide","options":[{"t":"Ask who decides and how many must agree","d":2,"do":"Write down the names and roles they give you.","say":"Who makes this decision, and how many people have to say yes?"},{"t":"Ask who is likely to push back, and why","d":2,"do":"Answer that concern in writing before the decision is made.","say":"What would the people who decide push back on?"},{"t":"Ask who signs once it is approved","d":10,"do":"This can wait for your next planned contact.","say":"When it is approved, who signs the agreement?"}]},{"t":"Offer to help your contact present it","why":"Your contact may have to carry your proposal into a meeting you will not be in. Make that easy for them, and let them choose how.","src":"I have not sent the proposal, step 2: Book a proposal review","options":[{"t":"Offer to join the meeting for ten minutes","d":2,"do":"In person or by video. If they say no, offer a one-page summary.","say":"Would it help if I joined for ten minutes to answer questions? If not, I’ll give you one page to hand out."},{"t":"Give them a one-page summary in their words","d":5,"do":"Why this work, why now, and the price. Get it to them a few days before the decision."},{"t":"Offer a site walk for the people who decide","d":10,"do":"Go through your contact. Do not go around them.","say":"Would any of the people who decide like to walk the site with us first?"}]},{"t":"Agree who else stays involved","why":"The name on the proposal is not always the person who decides. Someone still handles the contract, the deposit and the notices. Find out who, without going around anyone.","src":"Review the job, step 3: Check what you know","options":[{"t":"Ask your contact how they want it handled","d":2,"do":"This keeps your contact in the lead.","say":"Who else should I keep in the loop, and how would you like me to do that?"},{"t":"Send the current proposal to those who need it","d":3,"do":"With your contact’s OK, send a short, friendly note with the latest proposal and copy your contact. Ask if anyone needs anything else."},{"t":"Ask who the single point of contact will be","d":10,"do":"Write the name down.","say":"Once it is approved, who is our one point of contact for the contract, the deposit and the schedule?"}]}]},{"q":"How will the work be awarded, including approval steps, budget or funding, decision criteria, and competition?","check":"In the proposal: the deposit, the payment terms, and anything priced so the work can be done in parts.","often":"The decision date, which budget pays, how they will choose, and who else is bidding.","suggestions":[{"t":"Get the decision date","why":"Someone has to approve this, on some date. Every other date works back from it. On a general contractor or public bid, the bid documents give the dates.","src":"They are waiting for approval, step 3: Find what the approver needs","options":[{"t":"Ask when they decide and how to get on the agenda","d":2,"do":"Write the date down in their words.","say":"When is the next meeting or review, and what does it take to get this on it?"},{"t":"Ask what they need, and by when","d":2,"do":"Get it to your contact a few days ahead.","say":"What will the people who decide need to feel comfortable approving this, and when do they need it?"},{"t":"No date? Write UNKNOWN and set your own","d":10,"do":"Ask what has to happen first. Write the customer’s date as UNKNOWN and put your own review date on the calendar. Never pass your date off as theirs."}]},{"t":"Find out where the money comes from","why":"A customer can want the work and still have no money released for it. Find out which budget pays and how much is ready now.","src":"I have not sent the proposal, step 3: Ask how they will decide","options":[{"t":"Ask which budget pays for it","d":2,"do":"Write down the budget and who told you.","say":"Is money set aside for this? Which budget does it come from?"},{"t":"Ask if the first part fits what is ready now","d":2,"do":"If it does not fit, the answer tells you the size of the first step.","say":"Does [the first part] at [price] fit what can be released now? If not, which part does?"},{"t":"Ask when next year’s money is decided","d":10,"do":"Get your figures to them a week before that date.","say":"When do you need our figures for next year’s budget, and when is it approved?"}]},{"t":"Find out about other bids and how they choose","why":"If the customer wants more than one bid, that is routine. Better to know now, and to know what they will judge.","src":"I have not sent the proposal, step 3: Ask how they will decide","options":[{"t":"Ask if more than one bid is required","d":2,"do":"If other bids are coming, ask when they are due.","say":"How does work this size usually get approved? Is there a dollar limit, or a number of bids required?"},{"t":"Offer a scope sheet with no prices","d":3,"do":"If they say yes, send it the same day with no pricing on it.","say":"Would it help if I sent a one-page scope sheet, so every bid is priced on the same work?"},{"t":"Ask what matters most when they choose","d":2,"do":"Write the answer into your summary as its own line.","say":"What will matter most when you choose a contractor?"}]}]},{"q":"What has the customer said will happen next, who owns it, and when will it happen?","check":"In your notes: what the customer said they will do next, and any date they gave.","often":"The customer’s date. “Soon” is not a date.","suggestions":[{"t":"Turn it into a step with a date","why":"A deal is moving only when the customer owns the next step and gives their own date. “I’ll follow up” is your action, not theirs.","src":"They are waiting for approval, step 5: Agree whether to act or wait","options":[{"t":"Ask for the step and the date","d":2,"do":"Write down what they say, in their words.","say":"Before we hang up, can we agree on what happens next? Who has it, and when should I expect it?"},{"t":"Tie your next call to their date","d":2,"do":"Then keep your word and stay quiet until that day.","say":"When do you expect it to be decided? I’ll call you the day after, and I’ll leave you alone until then."},{"t":"Confirm it in writing after the call","d":3,"do":"Send two lines: their next step and their date in their words, then what you will do and by when. If they gave no date, say the date is still open."}]},{"t":"Put your own review date on the calendar","why":"When the customer’s date is UNKNOWN, set your own date to look at this again. Never present it as the customer’s date.","src":"Review the job, step 6: Write the plan","options":[{"t":"Two weeks out","d":10,"do":"Start the review with: “Last time, the next move was [next move]. What’s changed?”"},{"t":"One week out, because something is urgent","d":5,"do":"Use this when the price has run out, a deadline is close, or the Owner has a decision to make."},{"t":"The day after the customer’s date","d":10,"do":"Use this once the customer gives you a date.","note":"Until you have their date, keep this two-week date."}]},{"t":"Write the record and get the Owner’s sign-off","why":"Put the plan in one place: what’s next, who owns it, the customer’s date, your commitment and your review date. The Owner reads it and signs.","src":"Review the job, step 6: Write the plan","options":[{"t":"Fill in the Opportunity Action Record","d":1,"do":"What’s next, who owns it, the customer’s when or UNKNOWN, your commitment, your review date and one status."},{"t":"Add one line to your tracker or CRM","d":1,"do":"Paste the line below and fill in the blanks.","say":"[Customer’s next step]. Owned by [name]. Customer when: [date or UNKNOWN]. My review date: [date].","sayKind":"Write this"},{"t":"Take the record to the Owner","d":2,"do":"Do this when the job is over $75,000 with a board or general contractor award, the price is more than 60 days old, or there is a contract, wage, bonding or production rate question. The Owner decides, then signs with name and date. If you are the Owner, sign it yourself."}]}]}],"stamp":"Master version 5. Prepared Mon, Nov 16, 2026 at 9:03 PM ET."};

h a useful question because the job has gone quiet without a known process."],["CLOSE","Record the evidence that the job is lost, cancelled or no longer viable."]]},{"t":"selector","title":"Which play am I in?"},{"t":"triggers","title":"Bring it to the Owner when"},{"t":"form","id":"plan","title":"Planning the conversation","fields":[{"k":"dir_why","label":"Why this direction","hint":"One or two sentences.","rows":2},{"k":"ask_q","label":"Up to three questions for the customer","hint":"For ACT, DISCOVER or RE-ENGAGE.","rows":4},{"k":"wait_for","label":"If WAIT: wait for, and listen for","hint":"No customer outreach right now. Name the trigger you are waiting for, and what would tell you the opportunity has changed.","rows":3}]}],"done":["One move is chosen. If waiting or closing, I will go straight to step 6.","Any required owner decision is recorded."]},{"title":"Write the plan","goal":"Record one plan. Keep the customer’s timing separate from your own deadline.","blocks":[{"t":"p","text":"Customer timing comes from the customer. Use UNKNOWN if no date was given. Your review date is when the CSA or Owner will look at this again."},{"t":"form","id":"move","title":"The next move","fields":[{"k":"rec_what","label":"What’s next?","hint":"ACT, DISCOVER or RE-ENGAGE: the specific action. WAIT: the customer event, decision, approval or information you are waiting for.","rows":2},{"k":"rec_who","label":"Who owns it?","hint":"The person responsible. For a WAIT, the owner on the customer’s side, or UNKNOWN.","rows":1},{"k":"rec_when","label":"Customer when?","hint":"The customer’s confirmed date or timeframe, or UNKNOWN.","rows":1},{"k":"rec_purpose","label":"Purpose","hint":"Why this improves the opportunity. Generic follow-up doesn’t qualify.","rows":2},{"k":"rec_csa","label":"Your commitment (CSA or owner)","hint":"What the CSA will do, or deliberately not do, and by when.","rows":2},{"k":"rec_review","label":"Your internal review date","hint":"The date you will review th ,["Next","next"],["Biggest gap","gap"],["Status","status"],["Play","=play"],["What’s next?","rec_what"],["Who owns it?","rec_who"],["Customer when?","rec_when"],["Your commitment (CSA or owner)","rec_csa"],["Your internal review date","rec_review"],["Owner decision","=owner"],["Owner sign-off","rec_signoff"]]}],"done":["The next move, person responsible, customer timing and my commitment are written.","One status and an internal review date are recorded; required owner sign-off is complete."]},{"title":"What changed?","goal":"Ask what changed, then update only those answers.","blocks":[{"t":"say","kind":"Open with","text":"Last time, this opportunity was [status] and the next move was [next move]. What’s changed?"},{"t":"form","id":"reopen","title":"For this opportunity","fields":[{"k":"reopen","label":"Your opening line next time","rows":2}]}]}]},{"id":"before","cls":"pb-before","tag":"I have not sent the proposal","after":"Every proposal","quote":"“Just email me the proposal.”","setting":"The proposal is not sent yet.","win":"A clear proposal, a review plan and the customer’s next step.","rule":"Make it easy to understand and approve.","use":["Run it when","The proposal hasn’t gone out, or it went out without a live walk-through. Every step also works after sending."],"steps":[{"title":"Check the facts before sending","goal":"Know who decides, what they need, how the work is approved, and when your price expires. Mark anything missing UNKNOWN.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Before I finish the proposal, can we confirm who approves the work and what they need to see?"}],"note":{"label":"Which of the six you can’t answer yet","ph":"Example: who signs, and whether the board meets this month"},"done":["I know which facts are missing before I send the proposal."]},{"title":"Book a proposal review","goal":"Offer a short call to explain the proposal. Invite the person who makes the decision, if the customer’s process allows it.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Could we set aside 15 minutes to review this together? Would [time A] or [time B] work?"}],"done":["A review is booked, or I recorded why the process does not allow one."]},{"title":"Ask how they will decide","goal":"Ask about the approval steps, available budget, and what matters most. Do not repeat questions already answered.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"What will matter most when you choose a contractor, and what approvals are needed?"}],"note":{"label":"Decision-maker, approval steps, budget source, other bids","ph":"Write UNKNOWN for any you couldn’t confirm"},"done":["I recorded how the customer chooses and approves a contractor."]},{"title":"Make the proposal easy to compare","goal":"Clearly state the work, price, access needs and price expiry. Offer a smaller option only if it solves a real budget or timing problem.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"This covers [work] and protects [what matters]. Would a smaller first phase help, or do you need the whole job together?"},{"t":"owner","text":"If the customer’s decision date falls after your price hold, or the price is already more than 60 days old, bring it to the Owner before you send. The Owner decides whether to hold the price or reprice."}],"done":["The proposal states the work, price, access needs and price expiry."]},{"title":"Agree what happens after the review","goal":"Ask what the customer will do next. Record their name and timing, or UNKNOWN.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"After we review it, what happens on your side? Who handles that, and when do you expect it?"}],"done":["The customer’s next step, owner and timing are recorded, with UNKNOWN where needed."]},{"title":"Send it and confirm the plan","goal":"Send the proposal by the agreed deadline. Review it together if allowed, then confirm the agreed next step in writing.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Here is the proposal we discussed. Your next step is [action], owned by [name], with timing [customer date or UNKNOWN]. I will [your action] by [your date]."}],"done":["The proposal and confirmation were sent as agreed."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["When the request comes in","Ask who decides and how it gets approved before you walk the site."],["At the walk-through","Book the proposal review before you leave the site."],["Every proposal","Two options, a price hold date, and a walk-through on the calendar before you hit send."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]},{"id":"price","cls":"pb-price","tag":"They say the price is too high","quote":"“You’re higher than the other bid.”","setting":"The customer wants a lower price.","win":"A fair comparison and an approved option that fits the need.","rule":"Understand the price concern before changing the offer.","use":["Run it when the review says","ACT. There is an objection you can resolve."],"steps":[{"title":"Check your price before changing it","goal":"Review the work, preparation, coats, access and working hours. Do not promise a discount before you understand the difference.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"I can help compare what is included before we change the price."}],"note":{"label":"What in your price would a cheaper bid most likely leave out?","ph":"Example: full prep, two coats, off-hours work, daily cleanup"},"done":["I reviewed what is included before offering a new price."]},{"title":"Ask permission to compare","goal":"Thank the customer. Ask a few questions without demanding a copy of another contractor’s proposal.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Thanks for telling me. May I ask a few questions to check whether both prices cover the same work?"}],"done":["The customer agreed to questions, or we agreed another time."]},{"title":"Find the actual problem","goal":"Find out whether the issue is a cheaper competing price or a fixed budget. Ask what must stay in the job.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Is the issue the other price or a budget limit? What matters most to you that we need to protect?"}],"note":{"label":"What can’t go wrong for this customer, and what does it require from you?","ph":"Example: lobby open by 7:00, no odor during business hours"},"done":["I know whether the concern is a competing price or a budget limit."]},{"title":"Offer a smaller job if it helps","goal":"Price less work as a separate option. Keep the required preparation, coatings and protection. Ask the owner before discounting the same work.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"We could do [priority areas] now for [approved price] and leave [other areas] for later. Would that solve the budget issue?"},{"t":"owner","text":"If the customer wants a lower price for the same scope, or a cut beyond the smaller scope you offered, bring it to the Owner. The Owner decides."}],"note":{"label":"The smaller scope you offered, and its price","ph":"Example: front of building and lobby now, rear and service areas as phase two"},"done":["I offered an appropriate option, or referred the price decision to the owner."]},{"title":"Find who can approve it","goal":"Confirm the preferred option, who can authorize it, and what that person needs. Do not promise an unchecked crew date.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Who can approve this option? What do they need from us, and when do you expect a decision?"}],"note":{"label":"Who authorizes it, and what they need to see","ph":"Name, role, and what a yes depends on"},"done":["I recorded who approves the option and what they need."]},{"title":"Send the agreed options","goal":"Send the revised work and price by your promised time. State how long each price holds. Hand customer commitments to production after award.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Attached are the options we discussed. You preferred [option]. [Name] will [customer action] by [their date or UNKNOWN]. I will [your action] by [your date]."}],"done":["I sent the agreed options and recorded my next action."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["At the walk-through","Ask what can’t go wrong, who uses the space and when, how the decision gets made and if there’s a budget number."],["In the proposal","Give what matters most its own line, such as “Lobby open and dry by 7:00 a.m. daily.” A cheaper bid that leaves it out is then easy to spot. Offer two scopes, so the choice is between your options."],["When you send it","Book the review call before you send. Walk the customer through the proposal live, so price is never the only thing they’ve seen."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]},{"id":"approval","cls":"pb-approval","tag":"They are waiting for approval","quote":"“It’s still waiting on approval.”","setting":"A board, owner or manager still needs to approve the work.","win":"Clarity on the approval and whether you should help or wait.","rule":"Provide missing help, then respect the approval process.","use":["Run it when the review says","ACT or WAIT. The customer is working through an approval."],"steps":[{"title":"Check what is actually waiting","goal":"Read the last customer update. Identify the approval still needed. If the customer is already working through a known process and needs nothing, wait.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Before I send anything else, I want to understand which approval is still needed."}],"done":["I know what approval is pending, or the exact fact still missing."]},{"title":"Ask where the approval stands","goal":"Ask your contact only for information that is still missing. Do not assume silence means rejection.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"What approval is still needed, and is there anything missing that we can help with?"}],"note":{"label":"Where the proposal sits right now","ph":"Example: not yet presented, missed the last meeting"},"done":["I recorded where the approval stands."]},{"title":"Find what the approver needs","goal":"Identify the person or group deciding, the main concern, and any funding limit.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"What will the decision-makers need to feel comfortable approving this?"}],"note":{"label":"Which part your contact can defend, and why. Date of the next approval meeting.","ph":"Example: the two worst buildings first. Approvers meet on the 14th."},"done":["I know what the approver needs, or recorded UNKNOWN."]},{"title":"Provide only the missing help","goal":"If requested, send a one-page summary of the work, price and operating plan. Offer phases only if the full job cannot be approved.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Would a one-page summary of [specific issue] help the decision-makers, or do they already have what they need?"},{"t":"owner","text":"If the job is over $75,000 and a board awards it, or your price is more than 60 days old, bring it to the Owner before the summary goes out. The Owner decides."}],"note":{"label":"The questions the one-page summary has to answer for the approvers","ph":"Example: why this part first, what waiting costs, plan for the rest"},"done":["I provided the requested help, or confirmed nothing else is needed."]},{"title":"Agree whether to act or wait","goal":"If the customer has everything, respect the approval process. Record the event, owner, customer timing or UNKNOWN, and your own review date.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"You are waiting for [approval]. Who owns that step? Is the timing known, and how would you like us to reconnect afterward?"}],"note":{"label":"The customer’s decision date, and the date you agreed to call","ph":"Example: approvers meet the 20th, I call the 21st"},"done":["I chose a useful action or a justified wait."]},{"title":"Record the wait or promised action","goal":"Send only what was requested. Calendar your own review. Do not add another customer call unless there is a useful reason.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"We are waiting for [event], handled by [name]. Customer timing is [date or UNKNOWN]. I will [agreed action or wait] and review this internally on [date]."}],"done":["The approval event, customer timing and my own review date are recorded."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["At the first meeting","Ask how a project this size gets approved: who is in the room, how often they meet, the dollar limit, and how many bids they require."],["At the walk-through","Rank the areas by condition with your contact while you’re on site. Ask which ones they would do first."],["In the proposal","Open with a one-page summary written for the person who has to present it. Offer phasing from the start."],["At the follow-up","Ask for the meeting date, and send what your contact needs a few days ahead of it."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]},{"id":"deadline","cls":"pb-deadline","tag":"They need a firm finish date","quote":"“Confirm you’ll finish by the deadline and it’s yours.”","setting":"The customer wants a firm completion date.","win":"A schedule checked by production and agreed access to the site.","rule":"Promise only dates your team has checked.","use":["Run it when the review says","ACT. The customer wants a commitment you don’t fully control."],"steps":[{"title":"Check before promising a date","goal":"Review the work and available production capacity. Do not confirm a finish date until production checks it.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"I understand the target. Let me check the work and access before I confirm what we can deliver."},{"t":"owner","text":"Your answer depends on a production rate: how many working days the crew needs. If you aren’t sure of the rate, bring it to the Owner before you commit to a date."}],"note":{"label":"Working days before the deadline, and what you could finish with full access","ph":"Example: 9 working days left, the job needs 6 with every area released"},"done":["I have not promised an unchecked date."]},{"title":"Find out why the date matters","goal":"Ask what event drives the date and whether the whole building or just certain areas must be ready.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"What happens on that date, and which areas must be ready for it?"}],"done":["I know why the deadline matters and which areas must be ready."]},{"title":"Confirm when the space is available","goal":"Find who releases each area, when work can start there, and what must stay open.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Who can give us access, when can each area be released, and what needs to stay in use?"}],"note":{"label":"The paperwork deadline and its reason. The finish deadline and its reason. Who controls access.","ph":"Example: order must be placed this month. Work done before the inspection on the 12th. Facility lead controls the area."},"done":["Access windows and the person releasing the space are recorded."]},{"title":"Build the schedule with production","goal":"Have production check crew capacity, preparation, drying time and access. If the target is not realistic, offer a workable sequence.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Our team needs [access window] for [area]. Could you provide that, or should we prioritize a smaller area first?"}],"note":{"label":"The area the customer will release, with release and hand-back times","ph":"Example: east wing, out Friday 6 p.m., back Monday 5 a.m."},"done":["Production checked the schedule, or I recorded what they still need."]},{"title":"Agree the dates you can keep","goal":"Confirm the checked schedule and any dependencies. Ask when approval is needed to support it; do not invent a customer commitment.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"We can meet [checked target] if [access and approval conditions] are met. Can you confirm those conditions?"}],"note":{"label":"The commitment you gave, in your words, and the customer’s award date","ph":"Example: east wing done by the 30th if released Friday night. Award expected Wednesday."},"done":["The dates and conditions are agreed, or outstanding conditions are clearly marked."]},{"title":"Write down the schedule","goal":"Send areas, access windows, completion targets and responsibilities to the customer and production. Agree how access delays affect dates.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Here is the agreed schedule. [Name] releases [area] at [time]. We return it at [checked time]. If access changes, we will confirm the revised schedule together."}],"done":["The customer and production have the same written schedule."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["At the first call","Ask who uses the space and who controls access to it. Ask to meet that person at the walk-through."],["At the walk-through","Walk it with the people who run the space. Ask about their busiest days and what can come out of use."],["In the proposal","State the duration as working days after each area is released. Leave out calendar dates you don’t control. Show the areas on a sketch."],["At the follow-up","Ask if there’s a budget period the order has to land in, so the deadline doesn’t arrive as a surprise."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]},{"id":"quiet","cls":"pb-quiet","tag":"They have stopped replying","quote":"You’ve followed up. Nothing came back.","setting":"There is no reply and no known active approval process.","win":"A confirmed next step, a sensible pause or a reason to close.","rule":"Ask what changed; do not keep sending the same message.","use":["Run it when the review says","RE-ENGAGE. There is no credible sign of an active customer process."],"steps":[{"title":"Check whether waiting is reasonable","goal":"Read the last conversation. If a known approval or budget process is still underway, use that playbook. Use this one when there is no credible update.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"I want to understand whether the project is still planned or whether priorities have changed."}],"note":{"label":"Something coming up in their business that you can ask about","ph":"Example: lease renewals in the spring, an inspection next month"},"done":["I checked that this is not a known customer approval or budget process."]},{"title":"Make one useful contact attempt","goal":"Use a short message tied to the customer’s project. Avoid repeated “just checking in” emails.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Is [project] still something you want to complete, or have your priorities changed? Either answer helps us plan."}],"done":["I made a useful contact attempt and recorded the result."]},{"title":"Learn what changed","goal":"If they reply, ask whether the issue is timing, budget, approval or a cancelled project. Listen before offering a solution.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"What changed since we last spoke, and what would need to happen for this work to move ahead?"}],"note":{"label":"What’s on hold and until when. The space that still matters, and the date it matters by.","ph":"Example: capital on hold to January. Main entry matters before the open house on the 6th."},"done":["I recorded what changed, or NO RESPONSE."]},{"title":"Offer help only if there is a need","goal":"If there is a smaller priority they actually want done, offer it separately. Otherwise agree to pause or close the job.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Would [specific smaller job] help now, or would it be better to pause this until [customer event]?"},{"t":"owner","text":"Before you bring the full project back, check how old its price is. If it’s more than 60 days old, bring it to the Owner. The Owner decides whether to hold the price or reprice."}],"note":{"label":"The small job, its price, and the date it must be ready","ph":"Example: main entry walls and trim, two days midweek, ready by the 4th"},"done":["I offered relevant help, or chose to pause without creating more work."]},{"title":"Agree to proceed, pause or close","goal":"For an active job, ask who approves it and what happens next. If there is no reply, set an internal review date; silence alone does not prove a loss.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Should we plan the next step, put this on hold, or close our estimate? If it is on hold, what would make it worth revisiting?"}],"note":{"label":"Who approves and their limit. What you asked for, and the answer.","ph":"Example: manager signs repairs under their limit. Asked for a signature this week."},"done":["I recorded proceed, pause or close with the evidence behind it."]},{"title":"Record what you learned","goal":"Write the customer’s answer or NO RESPONSE. Record your next action and review date. Do not record an assumed award, loss or customer promise.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Current position: [confirmed update or NO RESPONSE]. My next action is [useful action or pause] by [date]. Customer timing is [their date or UNKNOWN]."}],"done":["My next action and review date are recorded without inventing a customer promise."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["At the walk-through","Ask which budget the work comes from, capital or repair and maintenance, and what your contact can approve alone."],["In the proposal","Offer a small first job next to the full scope, so a freeze still leaves you something to talk about."],["When you send it","Book the review call before you send the proposal: “I’ll walk you through it Thursday at two.”"],["At the follow-up","After two unanswered messages, change the channel and the subject. Skip the third."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]},{"id":"nextyear","cls":"pb-nextyear","tag":"They need a later budget","quote":"“We’ll have to look at it next year.”","setting":"The work depends on a later budget.","win":"Useful budget figures and the next funding milestone.","rule":"Support their budget process without inventing urgency.","use":["Run it when","The money depends on a budget that isn’t approved yet."],"steps":[{"title":"Find out what “next year” means","goal":"Check whether the customer is preparing a budget, awaiting funding or simply postponing the work.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Is this being included in a planned budget, or is the timing still undecided?"}],"done":["I know whether there is an active budget process, or recorded UNKNOWN."]},{"title":"Ask about the budget calendar","goal":"Find out when project costs are needed and when funding is decided. These may be different dates.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"When do you need our figures for the budget, and when is that budget normally approved?"}],"done":["Budget submission and approval timing are recorded, with UNKNOWN where needed."]},{"title":"Learn what gets funded","goal":"Ask who prepares the budget, who approves it and what information supports the request.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Who puts this project into the budget, and what do they need from us to support it?"}],"note":{"label":"Budget calendar: draft date, approval date, who builds it, type of money","ph":"Example: draft due in January, board approves in March, capital"},"done":["I know who prepares the request and what information they need."]},{"title":"Send useful budget figures","goal":"Provide full or phased figures as requested. Explain price expiry and any need to update pricing before award. Do not guarantee today’s price indefinitely.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Here are the figures for [work]. The price is valid until [date]; after that we will confirm updated pricing before you approve the work."},{"t":"owner","text":"If your price is more than 60 days old, or the budget decision falls after your price hold, bring it to the Owner. The Owner decides whether to hold the price, reprice now, or give a budget range."}],"done":["The requested figures include a price expiry or repricing explanation."]},{"title":"Agree when to wait","goal":"Record who submits or approves the budget and customer timing or UNKNOWN. Once they have what they need, wait for that event.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Once you have these figures, what happens next on your side? Is there anything else you need before the budget decision?"}],"done":["I recorded the next budget event and whether any useful action remains."]},{"title":"Save both sets of dates","goal":"Record the customer’s budget deadlines separately from your internal review date. Reconnect when agreed or when a meaningful change occurs.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"[Name] will handle [budget step]. Their timing is [date or UNKNOWN]. I will [promised action] by [date] and review this again on [internal date]."}],"done":["The customer’s dates and my internal review date are separate."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["At the first meeting","Ask which budget the work comes from and when it’s set."],["In the proposal","Price by phase, and put a hold date on every price."],["Every year","Before the customer’s budget season, send updated figures for work they deferred."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]},{"id":"gc","cls":"pb-gc","tag":"A general contractor chooses","quote":"“Get us your number by bid day.”","setting":"A general contractor manages the job and selects the painting contractor.","win":"A complete bid and a clear understanding of the award process.","rule":"Confirm the required work and terms before you commit.","use":["Run it when","A general contractor awards the work."],"steps":[{"title":"Decide whether to bid","goal":"GC means general contractor: the company managing the construction job. Check the work, deadline, capacity and bid requirements with your owner.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Can you send the complete bid package, painting scope and subcontract requirements?"},{"t":"owner","text":"If the job is over $75,000, or there’s a bonding, prevailing wage or contract question, bring it to the Owner before you bid. The Owner decides whether to bid."}],"done":["The owner or responsible person has made the decision to bid."]},{"title":"Get the complete bid package","goal":"Confirm the drawings, specifications, changes to the bid documents, question deadline and submission deadline.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Please confirm we have the latest drawings and written changes. When are questions and our price due?"}],"done":["I have the current package and both deadlines."]},{"title":"Clarify what you must include","goal":"Check surfaces, coating systems, preparation, access and who supplies equipment. Ask written questions before the deadline.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Please clarify [specific gap] so our price includes the required work."}],"note":{"label":"Scope questions, exclusions and qualifications","ph":"Example: excludes factory-finished doors; assumes one color per room"},"done":["Missing scope details were clarified or clearly recorded."]},{"title":"Prepare the bid for review","goal":"Price the required work. Clearly list included work, excluded work and assumptions where allowed. Have the owner review contract or cost concerns.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Our price includes [work]. Please confirm [unresolved item] before we finalize the bid."},{"t":"owner","text":"Before your number goes out, the Owner decides on anything over $75,000, any bond, and any prevailing wage, contract or production rate question."}],"done":["The bid includes required work and necessary owner review is complete."]},{"title":"Submit and learn the award process","goal":"Submit by the required method and deadline. Confirm receipt, then ask how the winning contractor and painting subcontractor will be selected.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Please confirm receipt. What happens next in the award process, and is the expected timing known?"}],"done":["I submitted as required and recorded receipt and the expected award process."]},{"title":"Check the subcontract before starting","goal":"After selection, compare the subcontract with your bid. Get owner review of scope, payment terms, schedule and required documents before signing or mobilizing.","blocks":[{"t":"say","label":"Adapt these words to the customer","text":"Before we sign, let’s confirm the subcontract matches the agreed work, price, schedule and responsibilities."},{"t":"owner","text":"Contract terms, retainage, bonding and prevailing wage questions go to the Owner before anyone signs."}],"done":["The subcontract was checked before signing or starting; if not selected yet, I recorded the wait."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["Between bids","Get to know the estimators at the GCs you want to work with, outside a live bid."],["Every bid","Send a one-page scope sheet with your number, so you’re easy to compare."],["After bid day","Ask every GC for the results, win or lose. Track who won and by how much."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]},{"id":"public","cls":"pb-public","tag":"A public agency chooses","quote":"“Submit through the bid portal by the due date.”","setting":"An agency selects a contractor through a formal bid process.","win":"A complete submission that follows the published instructions.","rule":"Follow the official requirements and contact rules.","use":["Run it when","A public agency awards the work through a formal bid."],"steps":[{"title":"Read the agency’s bid instructions","goal":"For government or formal procurement work, follow the published process. Have the owner confirm the requirements and whether the business can meet them.","blocks":[{"t":"say","label":"Use only through the permitted channel","text":"Use the named procurement contact and permitted channel for all questions."},{"t":"owner","text":"If the solicitation needs a bond or prevailing wage, or the work is over $75,000, bring it to the Owner before you decide to bid."}],"done":["The owner or responsible person has confirmed we can meet the requirements."]},{"title":"Confirm required dates and documents","goal":"Check registration, any mandatory site meeting, question deadline, submission method and exact deadline. Use the solicitation as the authority.","blocks":[{"t":"say","label":"Use only through the permitted channel","text":"Please confirm [unclear requirement] using the question process stated in the bid documents."}],"done":["Required meetings, documents and deadlines are recorded."]},{"title":"Ask questions through the official channel","goal":"Submit written questions before the deadline. Track every formal written change. Do not rely on informal promises.","blocks":[{"t":"say","label":"Use only through the permitted channel","text":"Please clarify [specific specification or requirement] for this solicitation."}],"note":{"label":"Questions sent, addenda received, forms required","ph":"Example: Addenda 1 and 2 received; bid bond and non-collusion affidavit required"},"done":["Questions used the official channel and written changes were tracked."]},{"title":"Complete the required bid","goal":"Use the agency’s forms and required scope. Check signatures, attachments and acknowledgments. Get owner review of wage, bond, insurance or contract questions.","blocks":[{"t":"say","label":"Use only through the permitted channel","text":"Before submission, we need to verify every required form and written change is included."},{"t":"owner","text":"The Owner signs off on the final number, the bond and any wage or contract terms before the bid goes in."}],"done":["The bid is complete and required owner reviews are done."]},{"title":"Submit exactly as instructed","goal":"Submit early enough to resolve delivery problems. Keep receipt evidence. Follow the stated award process; do not seek an off-process commitment.","blocks":[{"t":"say","label":"Use only through the permitted channel","text":"Please confirm receipt through the permitted submission system or contact."}],"done":["I submitted as instructed and kept evidence of receipt."]},{"title":"Wait for the official next step","goal":"Record the agency’s award or review event and timing, or UNKNOWN. Complete required documents after award; start only when required authorization is in place.","blocks":[{"t":"say","label":"Use only through the permitted channel","text":"Our next step is [official requirement]. The agency’s timing is [published or confirmed date, or UNKNOWN]. We will review the status internally on [date]."},{"t":"owner","text":"The Owner reviews and signs the contract."}],"done":["The official next event and our responsibilities are recorded; no unauthorized start is promised."]},{"title":"Make the next job easier","goal":"Use these tips before the next proposal.","blocks":[{"t":"stages","rows":[["Before the solicitation","Register with the agencies that buy painting in your area, so you receive their notices."],["Every bid","Keep a checklist of the forms, bonds and insurance each agency asks for."],["After the opening","Read the bid results to learn the going price for public work."]]}]}],"spine":["Get ready","Start the conversation","Ask","Offer a solution","Agree the next step","Write it down","Next time"]}],"wnw":{"before":[[null,"","","Check the facts before sending.","Set your own deadline"],["Meets you to go through the proposal.","The decision-maker","The time you booked","Book a proposal review.","Set your own deadline"],["Tells you who decides, how it’s approved and where the money comes from.","Your contact","Before the proposal is final","Ask how they will decide.","Set your own deadline"],["Reviews the two options with you.","The decision-maker","The walk-through date","Make the proposal easy to compare.","Set your own deadline"],["Names their next step after the walk-through.","The decision-maker","Their date, or UNKNOWN","Agree what happens after the review.","Set your own deadline"],["Does what they said, by their date.","The person they named","Their date","Send it and confirm the plan.","Set your own deadline"]],"price":[[null,"","","Check your price before changing it.","Set your own deadline"],["Answers your questions on a call.","Your contact","The time they agree to","Ask permission to compare.","Set your own deadline"],["Explains the price concern and what matters most.","Your contact","The day they agree to","Find the actual problem.","Set your own deadline"],["Chooses between the two options.","Your contact","Their date, or UNKNOWN","Offer a smaller job if it helps.","Set your own deadline"],["Approves the revised scope.","The person who authorizes it, by name","Their decision date, or UNKNOWN","Find who can approve it.","Set your own deadline"],["Signs, and confirms the start date.","The approver, by name","Their date","Send the agreed options.","Set your own deadline"]],"approval":[[null,"","","Check what is actually waiting.","Set your own deadline"],["Tells you where the proposal sits with the approvers.","Your contact","On your call","Ask where the approval stands.","Set your own deadline"],["Puts the part they can defend in front of the approvers.","Your contact","The next approval meeting, or UNKNOWN","Find what the approver needs.","Set your own deadline"],["Takes the one-page summary to the approvers.","Your contact","The meeting date","Provide only the missing help.","Set your own deadline"],["Works through the known approval process.","The approvers. Your contact carries it.","Their meeting date, or UNKNOWN","Agree whether to act or wait.","Set your own deadline"],["Tells you the decision, and who signs.","Your contact","The day after the meeting","Record the wait or promised action.","Set your own deadline"]],"deadline":[[null,"","","Check before promising a date.","Set your own deadline"],["Tells you what the date is for and who controls the space.","Your contact","On the call","Find out why the date matters.","Set your own deadline"],["Introduces you to the person who controls the space.","Your contact","Today or tomorrow","Confirm when the space is available.","Set your own deadline"],["Releases the first area for a set window.","The access contact","The release date they agree to","Build the schedule with production.","Set your own deadline"],["Awards the work against the access schedule.","Your contact or the buyer, by name","Their award date, or UNKNOWN","Agree the dates you can keep.","Set your own deadline"],["Releases the first area to your crew.","The access contact","The release day and time","Write down the schedule.","Set your own deadline"]],"quiet":[[null,"","","Check whether waiting is reasonable.","Set your own deadline"],["Talks with you about what’s coming up, then about the project.","Your contact","On your call or visit","Make one useful contact attempt.","Set your own deadline"],["Explains whether the project is still planned.","Your contact","On the call","Learn what changed.","Set your own deadline"],["Confirms whether a smaller job would help, or agrees to pause.","Your contact","Before their date","Offer help only if there is a need.","Set your own deadline"],["Confirms whether to proceed, pause or close.","The approver, by name","The day they commit to, or UNKNOWN","Agree to proceed, pause or close.","Set your own deadline"],["Names the month to bring the full project back.","Your contact","The month they name","Record what you learned.","Set your own deadline"]],"nextyear":[[null,"","","Find out what “next year” means.","Set your own deadline"],["Tells you when next year’s budget is drafted and approved.","Your contact","On the call","Ask about the budget calendar.","Set your own deadline"],["Tells you when budget numbers are due.","Whoever builds the budget","Their deadline","Learn what gets funded.","Set your own deadline"],["Puts your figures in the draf
