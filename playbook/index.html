t budget.","Your contact","Their budget deadline","Send useful budget figures.","Set your own deadline"],["Approves the budget.","The board or budget owner","Their approval date, or UNKNOWN","Agree when to wait.","Set your own deadline"],["Tells you if it was approved.","Your contact","The day after approval","Save both sets of dates.","Set your own deadline"]],"gc":[[null,"","","Decide whether to bid.","Set your own deadline"],["Sends the full bid package and addenda.","The GC’s estimator","Their sub bid deadline","Get the complete bid package.","Set your own deadline"],["Answers your questions in an addendum.","The GC or the architect","Their question deadline","Clarify what you must include.","Set your own deadline"],["Receives your qualified number.","The GC’s estimator","Their sub bid deadline","Prepare the bid for review.","Set your own deadline"],["Learns the owner’s award and picks subs.","The GC","Their award date, or UNKNOWN","Submit and learn the award process.","Set your own deadline"],["Sends the subcontract.","The winning GC","Their date","Check the subcontract before starting.","Set your own deadline"]],"public":[[null,"","","Read the agency’s bid instructions.","Set your own deadline"],["Adds you to the plan holders list.","The named contact","Before the pre-bid meeting","Confirm required dates and documents.","Set your own deadline"],["Answers questions in an addendum.","The named contact","Their addendum date","Ask questions through the official channel.","Set your own deadline"],["Receives your complete bid.","The procurement office","The due date and time","Complete the required bid.","Set your own deadline"],["Opens the bids and makes the award.","The agency","Their award date","Submit exactly as instructed.","Set your own deadline"],["Issues the notice to proceed.","The agency","Their date","Wait for the official next step.","Set your own deadline"]]},"detail":[{"id":"review","kind":"review","cls":"pb-review","tag":"Opportunity review","spine":["Gather facts","Summarize","Check what you know","Find the missing piece","Choose your next move","Write the plan","What changed?"],"quote":"What’s actually happening?","setting":"Any open commercial opportunity over $20,000, before and during the review.","win":"What happens next, who owns it and when. Or an honest UNKNOWN and a date to look again.","rule":"Use evidence. Don’t guess. Don’t create activity just to have a next step.","use":["Who does what","The CSA or Owner preps, runs the review and makes the final call."],"statusKey":"status","wnwFrom":{"n":"rec_what","o":"rec_who","w":"rec_when"},"steps":[{"title":"Answer the six questions","goal":"The CSA or Owner completes the prep sheet and gathers the proposal and notes before the review.","blocks":[{"t":"p","text":"The review runs on three things: the six answers below, the current proposal or estimate, and any notes or customer information that help. Answer from what the customer said and did. Where you don’t know, write UNKNOWN."},{"t":"p","text":"If the proposal hasn’t gone out yet, run Before you send alongside this review."},{"t":"form","id":"prep","title":"CSA opportunity prep: six questions","copy":"Copy prep sheet","numbered":true,"fields":[{"k":"q1","label":"What is the project, scope and estimate amount?","rows":3},{"k":"q2","label":"What did the customer say or do in the last meaningful conversation, and when?","rows":3},{"k":"q3","label":"Why is the customer doing the project, and why now?","rows":3},{"k":"q4","label":"Who is the primary contact, who decides, and who else matters?","rows":3},{"k":"q5","label":"How will the work be awarded, including approval steps, budget or funding, decision criteria, and competition?","rows":3},{"k":"q6","label":"What has the customer said will happen next, who owns it, and when will it happen?","rows":3}]},{"t":"list","title":"Bring with it","items":["The current proposal or estimate","Relevant notes or other useful customer information"]},{"t":"avoid","items":["Answering with what you hope will happen in place of what the customer said.","Leaving out when the last meaningful conversation took place.","Writing your own follow-up as the customer’s next step."]}],"done":["All six questions are answered, with UNKNOWN where I don’t know.","The current proposal or estimate is attached.","Relevant notes are attached."]},{"title":"Get the pulse","goal":"In 60 to 90 seconds of reading, the CSA or Owner should know what is actually happening with the customer.","blocks":[{"t":"p","text":"The CSA or Owner works from a short pre-read built on the prep sheet, the proposal and the notes. Write it by hand below, or draft it with AI using the prompt. Either way the CSA or Owner, and not the AI, makes the final judgment."},{"t":"prompt","title":"CSA or Owner pre-read prompt","copy":"Copy the prompt","intro":"For one open commercial opportunity over $20K. Paste it into your AI tool together with the prep sheet, the current proposal and any notes."},{"t":"stages","title":"Evidence rules: label everything","rows":[["Customer confirmed","Something the customer said, requested, agreed to or did."],["Proposal confirms","Something written in the proposal."],["CSA knows","What the CSA knows from direct experience with the customer or account."],["CSA believes","The CSA’s judgment, confidence, prediction or assumption that the customer has not confirmed."],["Unknown","Important information that has not been established. Write UNKNOWN. Do not guess."]]},{"t":"avoid","title":"Don’t convert","items":["A CSA belief into a customer fact.","Account history into a customer commitment.","Seller activity into a customer next step.","An internal target date into a customer commitment date."]},{"t":"p","text":"If the materials conflict, flag the conflict."},{"t":"form","id":"preread","title":"The pre-read","copy":"Copy pre-read","fields":[{"k":"opp","label":"Customer and project","rows":1},{"k":"est","label":"Estimate","rows":1},{"k":"scope","label":"Scope","rows":2},{"k":"happening","label":"What’s actually happening?","hint":"Two to four sentences about the customer’s situation. Leave out the list of seller activity.","rows":4},{"k":"evidence","label":"Strongest customer evidence","hint":"The two or three strongest signs that this is a real opportunity.","rows":3},{"k":"position","label":"Value and position","hint":"One or two sentences on why you are or aren’t well placed to win. Evidence, not optimism.","rows":2},{"k":"unknown","label":"What’s unknown?","hint":"Only the unknowns that could change the outcome.","rows":3},{"k":"flags","label":"Conflicts in the materials","hint":"Where the prep sheet, the proposal and the notes disagree.","rows":2},{"k":"start","label":"CSA or Owner start here","hint":"One question to open the review. The default is below.","rows":2}]},{"t":"say","kind":"CSA or Owner starts here","text":"Based on the prep, here’s what appears to be happening: [short summary]. Is that accurate? What’s changed?"}],"done":["The pre-read can be read in 60 to 90 seconds.","Every statement is labeled with where it came from.","The review opened by checking that the summary is still accurate."]},{"title":"Run the Readiness Check","goal":"Eight yes or no questions, each backed by evidence. Then rate why, how and next from the answers.","blocks":[{"t":"p","text":"This is the hard test. Answer YES only when you can say who told you, or where it’s written, and when. A YES without evidence counts as NO."},{"t":"p","text":"The check passes when every critical question is YES. A missing key fact points to a step that can help. A failed check isn’t a lost deal. It tells you what to fix next, and you still set the status separately in step 6."},{"t":"readiness","title":"Readiness Check"},{"t":"stages","title":"Rate from the check","rows":[["How","YES only when questions 1 to 4 are all YES. PARTIAL when some are. NO when none are."],["Next","YES only when questions 7 and 8 are both YES."],["Why","Your judgment, backed by evidence from the prep sheet."]]},{"t":"rate","k":"why","title":"Why","opts":["YES","PARTIAL","NO"],"q":"Do we understand why the customer is doing this project and why the customer will spend the money?","consider":["Why the project exists","Why it is happening now","The customer’s need or desired outcome","What delay costs, when relevant","Evidence that the project is real"],"note":"A legitimate construction, maintenance, capital, turnover or operational need is reason enough. Don’t manufacture a dramatic business problem."},{"t":"rate","k":"how","title":"How","opts":["YES","PARTIAL","NO"],"q":"Do we understand how this opportunity gets from estimate to customer decision and award?","consider":["Primary contact","Decision-maker","Other important stakeholders","Approval process","Budget or funding","Competition or alternatives","Decision criteria","What has to happen before the work can be awarded"]},{"t":"rate","k":"next","title":"Next","opts":["YES","NO"],"q":"Has the customer committed to what happens next, who owns it and when it will happen?","note":"Be strict. If the customer owns the next move but hasn’t given a date, the rating is NO and the customer’s when is UNKNOWN. Never invent a customer date."},{"t":"avoid","title":"These are seller activities, not customer commitments","items":["“I’ll follow up.”","“I’ll call them.”","“I sent an email.”","“I’ll stop by.”","“I’m waiting to hear back.”","“I’ll check in next week.”"]}],"done":["All eight questions are answered, each YES with evidence.","Why, how and next each have a rating and one sentence, and none is kinder than the check.","No seller activity is counted as a customer commitment."]},{"title":"Name the one biggest gap","goal":"Find the one thing still unknown that would most improve your ability to predict or influence this opportunity.","blocks":[{"t":"p","text":"Don’t list every unknown. Pick one gap, write one specific question the CSA or Owner needs answered about it, and say what a strong answer would reveal. Your first critical NO in the Readiness Check is usually the biggest gap."},{"t":"list","title":"Where the gap usually sits","cols":true,"items":["Why","Decision-maker","Stakeholders","Budget","Competition","Decision criteria","Approval process","Customer dependency","Decision timing","Customer commitment"]},{"t":"form","id":"gap","title":"Biggest gap","fields":[{"k":"gap","label":"The one biggest gap","rows":2},{"k":"gap_q","label":"CSA or Owner question","rows":2},{"k":"gap_listen","label":"Listen for","hint":"What a strong answer would reveal.","rows":2}]}],"done":["There is exactly one gap.","There is one specific question about it."]},{"title":"Decide: act or wait","goal":"After checking the facts, the CSA or Owner chooses one direction, picks the play, and checks whether the Owner needs to decide.","blocks":[{"t":"p","text":"Apply one test. Is there something meaningful that can reasonably be done right now that would improve the probability of winning, or materially improve understanding of the opportunity?"},{"t":"choice","k":"dir","title":"Direction: choose one","opts":[["ACT","Meaningful action can improve or advance the opportunity: secure a customer meeting, review scope, resolve an objection, meet another stakeholder, provide requested information, or obtain a customer commitment."],["DISCOVER","Important information is missing, and learning it would materially improve the opportunity."],["WAIT","The customer is actively working through a known process, and more activity would not improve the opportunity right now."],["RE-ENGAGE","The opportunity has gone quiet and there is no credible evidence of an active customer process."],["CLOSE","Evidence indicates the opportunity is lost, cancelled, dead or no longer viable."]]},{"t":"list","title":"A legitimate WAIT means all five are true","items":["The opportunity is real.","The customer is actively working through something known.","The customer owns the next move.","The CSA understands what the customer is working through.","More pressure or follow-up would not improve the opportunity right now."]},{"t":"p","text":"WAIT does not mean do nothing and hope."},{"t":"selector","title":"Which play am I in?"},{"t":"triggers","title":"Bring it to the Owner when"},{"t":"p","text":"Plan customer questions only when action is needed. If the direction is ACT, DISCOVER or RE-ENGAGE, write no more than three questions the CSA or Owner could naturally ask the customer. The questions address the biggest gap or the next move, and they give the customer a legitimate reason for the conversation."},{"t":"avoid","title":"Don’t open with","items":["“Just checking in…”","“Wanted to follow up on the proposal…”","“Have you made a decision yet?”"]},{"t":"form","id":"plan","title":"Planning the conversation","fields":[{"k":"dir_why","label":"Why this direction","hint":"One or two sentences.","rows":2},{"k":"ask_q","label":"Up to three questions for the customer","hint":"For ACT, DISCOVER or RE-ENGAGE.","rows":4},{"k":"wait_for","label":"If WAIT: wait for, and listen for","hint":"No customer outreach right now. Name the trigger you are waiting for, and what would tell you the opportunity has changed.","rows":3}]}],"done":["One direction is chosen.","The play is picked, or the direction is DISCOVER because none fits yet.","If a trigger fired, the Owner decided.","If acting, the questions give the customer a real reason for the conversation.","If waiting, all five WAIT conditions are true."]},{"title":"Set the next move and record it","goal":"Write what happens next, who owns it and when. Assign one status. Put the next review on the calendar and get the Owner’s sign-off.","blocks":[{"t":"p","text":"Customer timing and review timing are different. The customer’s when is the date the customer says something will happen. If the customer hasn’t given one, write UNKNOWN. The Your internal review date date is when the CSA or Owner will look at the opportunity again if nothing changes. Never present it as a customer commitment."},{"t":"form","id":"move","title":"The next move","fields":[{"k":"rec_what","label":"What’s next?","hint":"ACT, DISCOVER or RE-ENGAGE: the specific action. WAIT: the customer event, decision, approval or information you are waiting for.","rows":2},{"k":"rec_who","label":"Who owns it?","hint":"The person responsible. For a WAIT, the owner on the customer’s side, or UNKNOWN.","rows":1},{"k":"rec_when","label":"Customer when?","hint":"The customer’s confirmed date or timeframe, or UNKNOWN.","rows":1},{"k":"rec_purpose","label":"Purpose","hint":"Why this improves the opportunity. Generic follow-up doesn’t qualify.","rows":2},{"k":"rec_csa","label":"Your commitment (CSA or owner)","hint":"What the CSA will do, or deliberately not do, and by when.","rows":2},{"k":"rec_review","label":"Your internal review date","hint":"The date you will review this opportunity again. Put it on your calendar.","type":"date"}]},{"t":"choice","k":"status","title":"Status: choose one","opts":[["ACTIVE — ADVANCE","A real opportunity with meaningful action or a customer commitment that can move it forward."],["ACTIVE — WAITING WITH DATE","The customer owns the next event and has given a specific date or timeframe."],["ACTIVE — CUSTOMER PROCESS","The opportunity is real and the customer is actively working through a known process, but has not committed to an exact date."],["NEEDS DISCOVERY","Important information required to understand or advance the opportunity is missing."],["STALE — RE-ENGAGE","The opportunity has gone quiet without evidence of a credible active customer process."],["LOST/DEAD — CLOSE OUT","Evidence indicates the opportunity is lost, cancelled, dead or no longer viable."]]},{"t":"avoid","title":"Status rules","items":["Keeping an opportunity active only because an estimate exists.","Moving a strong opportunity to NEEDS DISCOVERY only because the customer hasn’t given an exact decision date."]},{"t":"say","kind":"Close with","label":"If action is required","text":"So the next step is ______. ______ owns it, and it should happen by ______."},{"t":"say","kind":"Close with","label":"If discovery is required","text":"The biggest thing still needed is ______. The next move is to learn ______ by ______."},{"t":"say","kind":"Close with","label":"If waiting is appropriate","text":"The customer is currently working through ______. ______ owns that next move. Customer timing is ______, and this opportunity will be reviewed again on ______."},{"t":"form","id":"closing","title":"Close the review","fields":[{"k":"status_why","label":"Why this status","hint":"One or two sentences.","rows":2},{"k":"close","label":"The closing sentence","hint":"One sentence, using the pattern above that fits.","rows":2},{"k":"rec_signoff","label":"Owner sign-off","hint":"The Owner reads the record and signs with name and date. If you are the Owner, sign it yourself.","rows":1}]},{"t":"compare","title":"A weak record and a good one","note":"From a real condo-board deal, with the details removed. The weak record sounds busy but names no customer step and no date. The good one admits the date is UNKNOWN and still says exactly what happens next.","rows":[["What’s next?","Follow up with the board.","The board votes on phase one at its next meeting."],["Who owns it?","Us.","The board. The board president brings it to the vote."],["Customer when?","Soon. He says they’re working on it.","UNKNOWN. He hasn’t named the meeting date."],["Your commitment (CSA or owner)","Keep checking in.","Ask for the meeting date on the next regular call, and offer a one-page phase one summary."],["Reassessment","Left blank.","A date on the calendar, two weeks out."]]},{"t":"record","id":"record","title":"Opportunity action record","rows":[["Opportunity","opp"],["What’s happening?","happening"],["Readiness Check","=readiness"],["Why","why"],["How","how"],["Next","next"],["Biggest gap","gap"],["Status","status"],["Play","=play"],["What’s next?","rec_what"],["Who owns it?","rec_who"],["Customer when?","rec_when"],["Your commitment (CSA or owner)","rec_csa"],["Your internal review date","rec_review"],["Owner decision","=owner"],["Owner sign-off","rec_signoff"]]}],"done":["What’s next, who owns it and when are written, with UNKNOWN where the customer hasn’t said.","One status is assigned.","The reassessment date is on my calendar.","The Owner signed off, or I am the Owner.","The review closed in one sentence."]},{"title":"Start the next review with what changed","goal":"Don’t restart the whole qualification. Update only what moved.","blocks":[{"t":"say","kind":"Open with","text":"Last time, this opportunity was [status] and the next move was [next move]. What’s changed?"},{"t":"form","id":"reopen","title":"For this opportunity","fields":[{"k":"reopen","label":"Your opening line next time","rows":2}]},{"t":"p","text":"Then update only what changed, and reassess in the same order. Run the Readiness Check again. Each pass through a play is one play cycle. If the check still fails after two play cycles, bring it to the Owner."},{"t":"flow","title":"The process","items":["Open opportunity","Get the pulse","Readiness Check","Why, how, next","One biggest gap","Pick the play","Act or wait?","What, who, when","Assign status","Owner sign-off","Next review: what changed?"]},{"t":"p","text":"A successful review does not mean another follow-up. Never recommend activity for the sake of activity. Sometimes the best next move is to advance. Sometimes it is discovery. Sometimes it is to re-engage. Sometimes the opportunity should be closed. And sometimes the best next move is to respect the customer’s buying process and wait."}]}]},{"id":"before","cls":"pb-before","tag":"Before you send","after":"Every proposal","quote":"“Just email me the proposal.”","setting":"The estimate is ready and the customer wants it by email. Nobody has agreed what happens after they read it.","win":"A proposal the decision-maker has gone through with you, and a next step and date the customer agreed to.","rule":"Don’t send it cold. Book the walk-through first.","use":["Run it when","The proposal hasn’t gone out, or it went out without a live walk-through. Every step also works after sending."],"steps":[{"title":"Don’t send it cold","goal":"Check what you know before the proposal leaves your hands.","blocks":[{"t":"p","text":"A proposal sent by email gets read in a few minutes, usually for the price. Once it’s out, the customer sets the pace. Before you send it, check the six things that decide whether a deal moves."},{"t":"list","title":"Check before you send","items":["Who decides, and have you spoken with them?","What are the approval steps between your proposal and a signed award?","Where does the money come from?","Who else is bidding?","How long does your price hold?","What happens on the customer’s side after they read it, and when?"]},{"t":"p","text":"If the proposal is already out, run this play anyway. Every step works after sending. The walk-through just comes second."},{"t":"avoid","items":["Emailing the proposal with “Let me know if you have questions.”","Sending it before you know who will read it.","Pricing one option when the customer mentioned budget limits."]}],"note":{"label":"Which of the six you can’t answer yet","ph":"Example: who signs, and whether the board meets this month"},"done":["I know which of the six I can’t answer yet.","I haven’t sent the proposal cold."]},{"title":"Book the walk-through before you send","goal":"Get twenty minutes with the decision-maker to go through the proposal together.","blocks":[{"t":"p","text":"Ask for the meeting when the customer asks for the proposal. Twenty minutes, in person or on a shared screen, with whoever decides."},{"t":"say","label":"When they ask for the proposal","text":"I’ll have it ready by [day]. It will make more sense if we go through it together. It takes about twenty minutes. Could we do [day and time], and could [decision-maker] join?"},{"t":"say","label":"If it’s already out","text":"I sent the proposal on [date]. Rather than leave you to read it alone, could we take twenty minutes to go through it? I want to make sure it covers what you need."},{"t":"hear","rows":[["“Just email it.”","Say: “I will. I’ll send it the morning of our call so you have it in front of you. Does [time] work?”"],["“I’ll walk the board through it myself.”","Offer to join for ten minutes, or give them a one-page summary in their words."],["A time, and the decision-maker will join","Book it, and send the invitation while you’re still on the phone."]]}],"done":["A walk-through is booked, with a date and time.","The decision-maker is invited, or I know why they can’t come."]},{"title":"Confirm who decides and how","goal":"Answer Readiness Check questions 1 to 4 with evidence.","blocks":[{"t":"p","text":"These are the questions a stalled deal answers too late. Ask them while you’re still shaping the proposal, or now if it’s already out."},{"t":"ask","items":[["Who signs the contract, and who else needs to be comfortable with it?","Readiness 1: the decision-maker."],["What happens between our proposal and a signed contract? Who approves, in what order, and when do they meet?","Readiness 2: the approval steps."],["Is money set aside for this? Which budget does it come from?","Readiness 3: the budget source."],["Are you getting other bids? How many does your process require?","Readiness 4: the competition."],["What would make you choose one contractor over another?","The decision criteria. Write them into the proposal."]]},{"t":"hear","rows":[["“I make the decision.”","Ask: “If it’s over a certain amount, does anyone else sign?”"],["A board or committee","Ask when it meets and what it needs to see. You may need Stalled approval later."],["“It depends on next year’s budget.”","Run Next year’s budget."],["“We’re getting three bids.”","Ask when the bids are due and how they’ll be compared."]]}],"note":{"label":"Decision-maker, approval steps, budget source, other bids","ph":"Write UNKNOWN for any you couldn’t confirm"},"done":["I can name the decision-maker, and I’ve spoken with them.","I know the approval steps.","I know where the money comes from, or I’ve written UNKNOWN.","I know if others are bidding."]},{"title":"Shape the options and set the price hold","goal":"Build the proposal around what you learned, and put a hold date on the price.","blocks":[{"t":"p","text":"Give the customer a choice between your options, so the comparison isn’t only you against someone else. A good pair is the full scope, and a smaller first phase that fits the budget they described."},{"t":"list","title":"Build in","items":["Two options: the full scope, and a first phase or smaller scope with its own price","What matters most to the customer, as its own line","The date your price holds until, checked against the customer’s decision date","What the customer provides: access, parking, notices, power and water"]},{"t":"owner","text":"If the customer’s decision date falls after your price hold, or the price is already more than 60 days old, bring it to the Owner before you send. The Owner decides whether to hold the price or reprice."},{"t":"avoid","items":["One take-it-or-leave-it number.","A price hold that ends before the customer’s meeting."]}],"done":["The proposal has two options.","The price hold date covers the customer’s decision date."]},{"title":"Agree what happens after they see it","goal":"Before the walk-through ends, the customer names their next step and gives a date.","blocks":[{"t":"p","text":"End the walk-through with a question about their next step, not yours. A deal is moving only when the customer owns the next step and gives their own date."},{"t":"say","label":"At the end of the walk-through","text":"What happens on your side after today? Who else needs to see this, and when do you expect to decide?"},{"t":"say","label":"If they’re not sure","text":"That’s fine. When will you know who needs to see it? I’ll check back with you then."},{"t":"hear","rows":[["A person and a date","Write both down in their words. That’s a customer step."],["“We’ll get back to you.”","Ask: “When should I expect to hear from you?” If they won’t say, write the date as UNKNOWN."],["“Send it to [name].”","Ask if you can walk [name] through it too."]]}],"done":["The customer named their next step.","The customer gave a date, or I’ve written UNKNOWN."]},{"title":"Send it and walk it through live","goal":"Send the proposal the morning of the walk-through, then confirm in writing what was agreed.","blocks":[{"t":"list","title":"Send","items":["The proposal, the morning of the walk-through","After the call, a short note repeating the customer’s next step and date in their words"]},{"t":"say","kind":"Email this","email":true,"text":"Subject: [Property] proposal: next steps\n\n[Name], thanks for going through the proposal with me today. You said [their next step] by [their date]. I’ll [your action] by [your date].\n\nOption A: [full scope], [price].\nOption B: [first phase], [price].\n\nPricing holds until [hold date]."},{"t":"p","text":"Then run the Readiness Check in the opportunity review. If anything is still NO, it tells you which step to run next."}],"done":["The proposal was walked through live.","The customer’s next step and date are in writing.","I ran the Readiness Check."]},{"title":"Make it routine","goal":"Three habits that keep a proposal from ever going out cold.","blocks":[{"t":"stages","rows":[["When the request comes in","Ask who decides and how it gets approved before you walk the site."],["At the walk-through","Book the proposal review before you leave the site."],["Every proposal","Two options, a price hold date, and a walk-through on the calendar before you hit send."]]}]}]},{"id":"price","cls":"pb-price","tag":"Price pushback","quote":"“You’re higher than the other bid.”","setting":"The customer has a lower number and won’t share the details behind it.","win":"A signed scope at your pricing, sized to their budget, with what matters most to them intact.","rule":"Make the job smaller. Hold the price.","use":["Run it when the review says","ACT. There is an objection you can resolve."],"steps":[{"title":"Hold your number","goal":"Decide what you need to learn before you say anything about price.","blocks":[{"t":"p","text":"The gap is between two proposals, and you have only seen one of them. Until you know what the other one covers, you can’t tell if you’re high or if something was left out. A discount offered now tells the customer your first price was padded."},{"t":"p","text":"Before you call back, open your proposal and find the parts a cheaper bid would most likely skip: prep, the number of coats, working hours, access and protection, and how the site keeps running while you work."},{"t":"avoid","items":["Matching the number on the spot.","Asking to see the other bid. The customer already said no, and asking again costs you trust.","Running down the other contractor."]}],"note":{"label":"What in your price would a cheaper bid most likely leave out?","ph":"Example: full prep, two coats, off-hours work, daily cleanup"},"done":["I know which lines in my proposal carry the cost of what matters most to this customer.","I’ve decided I won’t discount on this call."]},{"title":"Thank them and ask permission","goal":"Lower the pressure so the customer will answer a few questions.","blocks":[{"t":"p","text":"The customer expects you to argue or to cave. Do neither. Say thanks for the number, say you won’t ask for the other bid, and ask if you can check that both proposals cover the same job."},{"t":"say","label":"On the phone","text":"Thanks for telling me where we landed. I’m not going to ask for their number or their paperwork. Can I ask a few questions to make sure both proposals are pricing the same job? If they are and we’re still high, I’ll tell you that."},{"t":"hear","rows":[["“Sure, go ahead.”","Move to Discover."],["“I just need you to sharpen your pencil.”","Say: “I can look at that. To do it right I need to know which parts of the job matter most to you, so I don’t cut the wrong thing.”"],["“I don’t have time for this right now.”","Ask for ten minutes later this week and offer two times."]]}],"done":["The customer agreed to a few questions."]},{"title":"Find what matters more than price","goal":"Learn what can’t go wrong on this job, and whether the other bid protects it.","blocks":[{"t":"p","text":"Price is the easiest thing to compare, so it comes up first. What your contact gets judged on is different: complaints, disruption, a job that drags, a finish that fails early. Ask how the site runs on a normal day and let them tell you what matters."},{"t":"ask","items":[["When this job is running, what can’t go wrong for you?","Opens the door to what your contact is judged on."],["Walk me through a normal day here. Who uses the space, and when?","Gets you the real limits on hours and access."],["What has to stay open, clean or quiet while we work?","You need specifics you can write into the proposal."],["What happened the last time a contractor worked here?","Past trouble shows you what they’ll pay to avoid."],["Does the other proposal spell out prep, coats, working hours and how the site stays in use?","You’re asking what’s in it. You aren’t asking to see it."],["Is the gap a comparison between two bids, or is there a budget number you have to stay under?","A comparison and a ceiling need different answers."]]},{"t":"hear","rows":[["A limit the other bid may not cover: hours, access, occupants, a date","That’s why your price is what it is. Say so in Reshape."],["“They didn’t really say how they’d handle it.”","The gap may be the plan. Offer to write yours out so the customer can ask the other bidder the same question."],["A hard budget ceiling","Explaining your price won’t close the gap. Go to Reshape and make the job smaller."],["“Both bids cover the same scope and terms.”","Take that at face value. Offer a smaller scope in Reshape, or decide this job isn’t yours at that price."]]}],"note":{"label":"What can’t go wrong for this customer, and what does it require from you?","ph":"Example: lobby open by 7:00, no odor during business hours"},"done":["I know what matters most to this customer besides price.","I know if the gap is a comparison or a ceiling.","I know what the other bid does and doesn’t say about it."]},{"title":"Make the job smaller, keep what matters","goal":"Offer a scope that fits the number without cutting what the customer just said matters.","blocks":[{"t":"p","text":"When dollars come off the price, work comes off the job. That keeps your pricing believable and gives the customer a real choice. Keep the part they said matters most in every option. It’s the reason to hire you."},{"t":"say","label":"Tie the price to what you heard","text":"You told me [what can’t go wrong] matters most. That’s the part of my price I won’t cut, because it’s the part that protects you. What I can do is make the job smaller."},{"t":"say","label":"Offer the smaller scope","text":"Here’s a version that fits. We do [the highest-priority areas] now, the way we planned it. [The lower-priority areas] become a second phase at the price I already gave you, and you release it when the budget is there. Would that work?"},{"t":"list","title":"What can come out","items":["Low-traffic or back-of-house areas","A building, elevation or wing that can wait a season","Optional items and add-ons","Items the customer’s own maintenance team can handle"]},{"t":"list","title":"What stays in","items":["Prep and the number of coats","The hours, access and sequence the customer asked for","Protection of floors, glass, landscaping and signage"]},{"t":"avoid","items":["Taking money off with nothing coming out of the scope.","Trimming prep to hit the number. You’ll pay for it on the callback."]},{"t":"owner","text":"If the customer wants a lower price for the same scope, or a cut beyond the smaller scope you offered, bring it to the Owner. The Owner decides."}],"note":{"label":"The smaller scope you offered, and its price","ph":"Example: front of building and lobby now, rear and service areas as phase two"},"done":["I offered a smaller scope with its own price.","What matters most to the customer is in every option.","The customer told me which option they prefer."]},{"title":"Ask who can authorize it","goal":"Find out who signs for the smaller scope, then ask for the approval.","blocks":[{"t":"p","text":"A smaller job can fall under a different approval limit, and sometimes that limit is your contact’s own. Ask. If someone else signs, find out what they need and make it easy to forward."},{"t":"say","label":"Find the signer","text":"If the smaller scope fits, who authorizes it? Is that you, or does it go to someone else?"},{"t":"say","label":"If it goes to someone else","text":"What do they need to see to say yes? I can put it on one page: the scope, the price, and how we protect what matters to you. You can forward it, or we can call them together."},{"t":"say","label":"Ask for the approval","text":"If I get you the revised scope by [day and time], when can you approve it? Knowing that lets me hold a crew for [start date]."},{"t":"hear","rows":[["“I can sign that.”","Ask for the approval and agree on a start date."],["“That goes to someone above me.”","Get the name, what that person cares about, and when they decide. Send the one-page summary today."],["“Let me think about it.”","Say: “Of course. Which part are you weighing? I’d like to get you what you need.” Then ask when they expect to decide."]]}],"note":{"label":"Who authorizes it, and what they need to see","ph":"Name, role, and what a yes depends on"},"done":["I know the name of the person who authorizes this.","I asked for the approval.","I have the customer’s date for the decision, or I’ve written UNKNOWN."]},{"title":"Put both options in writing today","goal":"Send the revised proposal the same day, and give production the commitments you made.","blocks":[{"t":"list","title":"Send today","items":["The revised proposal: smaller scope, price, and what matters most to the customer written as its own line","The second phase as an option, with its price and how long that price holds","A short email that repeats what the customer told you matters"]},{"t":"say","kind":"Email this","email":true,"text":"Subject: Revised scope for [property]\n\n[Name], thanks for the time today. You said [what can’t go wrong] matters most, so I kept that plan and made the job smaller.\n\nOption A: [smaller scope], [price]. Start [date].\nOption B: the full scope as first proposed, [price].\n\nYou mentioned [approver] signs off. I’ve attached one page they can read in two minutes. You said you expect a decision by [their date], so I’ll call you on [day] at [time]."},{"t":"p","text":"When it’s signed, write those commitments on the work order so the crew lead sees them on day one."}],"done":["The revised proposal is sent.","The follow-up call is on my calendar.","The commitments I made are on the work order."]},{"title":"Stop this stall before it starts","goal":"Three changes earlier in the sale that keep price from being the only thing compared.","blocks":[{"t":"p","text":"Use these tips on your next job."},{"t":"stages","rows":[["At the walk-through","Ask what can’t go wrong, who uses the space and when, how the decision gets made and if there’s a budget number."],["In the proposal","Give what matters most its own line, such as “Lobby open and dry by 7:00 a.m. daily.” A cheaper bid that leaves it out is then easy to spot. Offer two scopes, so the choice is between your options."],["When you send it","Book the review call before you send. Walk the customer through the proposal live, so price is never the only thing they’ve seen."]]}]}]},{"id":"approval","cls":"pb-approval","tag":"Stalled approval","quote":"“It’s still waiting on approval.”","setting":"Your contact wants the work. Someone above them holds the money: an owner, a board or a regional office.","win":"A version of the proposal your contact can defend, and a date tied to the customer’s own approval process.","rule":"Help your contact win the meeting you won’t be in.","use":["Run it when the review says","ACT or WAIT. The customer is working through an approval."],"steps":[{"title":"Work out what it means","goal":"Stop guessing, and set one aim for the next call.","blocks":[{"t":"p","text":"“Still waiting on approval” can mean four things. Nobody has presented it. It was presented and stalled. Something else took priority. Or the approvers want more bids. Each one calls for a different move, and the message doesn’t tell you which."},{"t":"p","text":"Your contact is your way in. They have to carry your proposal into a room you won’t be in. On the next call, find out where the proposal sits and what would make it easier to carry."},{"t":"avoid","items":["Sending another “just checking in.”","Going around your contact to the approvers. You’d lose your advocate.","Resending the same proposal with a new date on it."]},{"t":"example","title":"Example from a real deal","text":"A three-building condo community near the coast. The board president calls the CSA every other week and says, “We’ll get this done. I’m working on it!” But the board hasn’t voted, and he has said it may slip to next year. The play: ask where the vote sits, learn what the board can fund first, put phase one on one page for him, and tie the next call to the board’s meeting date."}],"done":["I’ve stopped assuming the approvers have read it.","My one aim for the call is to learn where the proposal sits."]},{"title":"Ask where it sits","goal":"Find out if the approvers have seen the proposal at all.","blocks":[{"t":"p","text":"Give your contact an easy way to tell you the truth. Offer the two most likely answers and let them pick."},{"t":"say","label":"On the phone","text":"Thanks for the update. I don’t want to keep pinging you about something that’s out of your hands. Can I ask where it sits right now? Have the approvers had a chance to look at it, or is it still waiting for a slot?"},{"t":"hear","rows":[["“It hasn’t been in front of them yet.”","Good news: nobody has said no. Go to Discover and learn what gets it in front of them."],["“They looked at it and didn’t decide.”","Say: “What questions did they have? I’d like to help you answer them.”"],["“They want more bids.”","Skip ahead to Decide."],["“The budget is tight this year.”","Say: “That makes sense. If you could only do part of it this year, which part would you fight for?”"]]}],"note":{"label":"Where the proposal sits right now","ph":"Example: not yet presented, missed the last meeting"},"done":["I know if the approvers have seen the proposal."]},{"title":"Find the part they can defend","goal":"Learn how the approvers decide, and which piece of the job your contact would stand behind.","blocks":[{"t":"p","text":"A project gets in front of the approvers when your contact believes they can defend it. Ask what they could stand behind today. Their answer is your new scope."},{"t":"ask","items":[["What did get approved or discussed in its place?","Shows you where the approvers’ attention is going."],["When is the next meeting or review, and what does it take to get this on it?","Gives you the customer’s date to work back from."],["If you had to stand up and defend this, which part could you defend today?","The most important question in this playbook."],["Why that part?","Their reasons become the first page of the new proposal."],["What would the approvers push back on?","Lets you answer the objection before the meeting."],["How does work this size usually get approved? Is there a dollar limit, or a number of bids required?","Tells you if another bid is coming."]]},{"t":"hear","rows":[["“I can defend part of it this year.”","That’s your scope. Ask which part and why, then go to Reshape."],["A meeting or decision date","Work back from it. Your contact needs your revision a few days ahead."],["“They always want more than one bid.”","Expect it. When it comes, it’s routine."],["“They’ll ask why now.”","Bring photos, and show what waiting will cost."]]}],"note":{"label":"Which part your contact can defend, and why. Date of the next approval meeting.","ph":"Example: the two worst buildings first. Approvers meet on the 14th."},"done":["I know which part of the job my contact can defend.","I know the date of the next approval meeting, or I’ve written UNKNOWN.","I know how many bids the approvers require."]},{"title":"Build the version they can carry","goal":"Rewrite the proposal around the part your contact can defend, with a one-page summary in their words.","blocks":[{"t":"p","text":"The approvers will give this a few minutes. Your contact needs one page that answers the questions they’ll be asked: why this part, why now, what it costs, and what happens to the rest."},{"t":"say","label":"Offer the rewrite","text":"Let’s make it the part you can defend. I’ll rewrite it as [phase one] now, with photos showing why it goes first, and a simple plan for the rest so the approvers can see where it’s headed. You’d have one page to hand them. Would that help?"},{"t":"list","title":"What goes on the one page","items":["Why this part first: photos of the worst conditions, described in your contact’s words","Why now: what gets more expensive if it waits","The price and schedule for phase one","How occupants are notified and kept clear of the work","The remaining phases laid out by year, with budget figures"]},{"t":"avoid","items":["Sending the full proposal again with one part highlighted.","Writing it in your language. Use your contact’s reasons and words.","Dropping the rest of the job. A phased plan shows the approvers where the property is headed."]},{"t":"owner","text":"If the job is over $75,000 and a board awards it, or your price is more than 60 days old, bring it to the Owner before the summary goes out. The Owner decides."}],"note":{"label":"The questions the one-page summary has to answer for the approvers","ph":"Example: why this part first, what waiting costs, plan for the rest"},"done":["The proposal covers the part my contact named.","There’s a one-page summary they can hand to the approvers.","The rest of the job appears as later phases."]},{"title":"Respect their process","goal":"Ask what else your contact needs, then stop selling when they say they have it.","blocks":[{"t":"p","text":"At some point your contact will tell you they have what they need and it is with the approvers, or that another bid has to come in first. That’s their process working. Pushing now can cost you the job. Two things help: make the comparison fair, and tie your next conversation to their date."},{"t":"say","label":"Check that they’re covered","text":"What else do you need from me to take this forward?"},{"t":"say","label":"When they need another bid","text":"That makes sense. Most approvers want more than one. Would it help if I sent a one-page scope sheet, so every bid is priced on the same work? It saves you explaining the differences later."},{"t":"say","label":"Tie it to their date","text":"When do you expect it to be decided? I’ll call you the day after, and I’ll leave you alone until then."},{"t":"hear","rows":[["“I have what I need.”","Believe it. Thank them and set the date."],["“I don’t know when they’ll decide.”","Write the customer’s when as UNKNOWN. Ask what has to happen first, and set your own review date."],["“Can you do any better on price?”","Say: “I’d like to wait until you have every bid. Then we can look at them against the same scope.”"],["“A scope sheet would help.”","Send it today with no pricing on it."]]},{"t":"avoid","items":["Cutting your price to head off another bid.","Asking who the other bidder is.","Sending more material after your contact has said they have enough."]}],"note":{"label":"The customer’s decision date, and the date you agreed to call","ph":"Example: approvers meet the 20th, I call the 21st"},"done":["My contact told me they have what they need.","My next call is tied to the customer’s date, or to a review date if theirs is unknown.","I offered a scope sheet if other bids are coming."]},{"title":"Keep your word and the date","goal":"Send what you promised today, then call on the day you said you would.","blocks":[{"t":"list","title":"Send today","items":["The phase one proposal and the one-page summary","The scope sheet, without pricing, if your contact wanted it","A short note confirming the date you’ll call"]},{"t":"say","kind":"Email this","email":true,"text":"Subject: Phase one proposal for [property]\n\n[Name], attached are the revised proposal for [phase one], the one-page summary for [the approvers], and a scope sheet you can give any other bidder.\n\nYou said you expect a decision around [date]. I’ll call you on [date] and won’t crowd your inbox before then. If anyone has a question in the meantime, I’m glad to answer it."},{"t":"p","text":"Call on the date you agreed. If it was approved, ask who signs and when you can plan the work. If it wasn’t decided, ask what is still needed and get the next date."}],"done":["Everything I promised went out today.","The call date is on my calendar.","I’ve noted the customer’s approval date."]},{"title":"Stop this stall before it starts","goal":"Four changes earlier in the sale that get your proposal in front of the people who decide.","blocks":[{"t":"p","text":"Use these tips on your next job."},{"t":"stages","rows":[["At the first meeting","Ask how a project this size gets approved: who is in the room, how often they meet, the dollar limit, and how many bids they require."],["At the walk-through","Rank the areas by condition with your contact while you’re on site. Ask which ones they would do first."],["In the proposal","Open with a one-page summary written for the person who has to present it. Offer phasing from the start."],["At the follow-up","Ask for the meeting date, and send what your contact needs a few days ahead of it."]]}]}]},{"id":"deadline","cls":"pb-deadline","tag":"Deadline pressure","quote":"“Confirm you’ll finish by the deadline and it’s yours.”","setting":"The customer wants a date. Finishing on time depends on access that someone else on their side controls.","win":"An award tied to a schedule built on access the customer has agreed to give.","rule":"Promise only what the customer can give you room to do.","use":["Run it when the review says","ACT. The customer wants a commitment you don’t fully control."],"steps":[{"title":"Don’t type “Confirmed” yet","goal":"Know what you could finish, and what it depends on, before you answer.","blocks":[{"t":"p","text":"The award is one reply away, and the reply they want is one word. But you can only finish on time if the customer gives you the space, and the person asking for the date often doesn’t control it. If you confirm and the access doesn’t come, you own a missed deadline on your first job there."},{"t":"p","text":"Before you answer, count the working days left. Check crew availability and dry times. Work out what you could finish with full access, so you know how much the access matters."},{"t":"avoid","items":["Replying “Confirmed” to secure the job.","Replying “We can’t make that” before you know what the date is for.","Settling this by email. It needs a call."]},{"t":"owner","text":"Your answer depends on a production rate: how many working days the crew needs. If you aren’t sure of the rate, bring it to the Owner before you commit to a date."}],"note":{"label":"Working days before the deadline, and what you could finish with full access","ph":"Example: 9 working days left, the job needs 6 with every area released"},"done":["I know how many working days are left.","I know what I could finish with full access.","I’m going to call instead of emailing."]},{"title":"Say yes to the goal, then ask about the date","goal":"Get permission to ask two questions before you confirm.","blocks":[{"t":"p","text":"The customer wants a fast, clean answer. Show you’re working toward a yes, then ask for a minute to make sure it holds."},{"t":"say","label":"On the phone","text":"I got your note, and I want to give you a yes I can keep. Can I ask two quick questions about the date before I confirm it?"},{"t":"hear","rows":[["“Sure.”","Move to Discover."],["“I just need a yes or no.”","Say: “Understood. I can give you a firm answer by [time today]. I need one thing first: who decides when we can have the space?”"]]}],"done":["The customer agreed to a couple of questions."]},{"title":"Find both deadlines","goal":"Learn what the date is for, who set it, and who controls the space.","blocks":[{"t":"p","text":"Two deadlines often hide in one sentence. One person may need the order placed by a date so the money stays in this budget. Another may need the work finished by a different date, for a different reason. They’re rarely the same day, and each belongs to a different person."},{"t":"ask","items":[["What happens on your side on that date? Is that when the order has to be placed, or when the work has to be finished?","Separates the paperwork date from the work date."],["Who set that date, and what is it tied to?","Finds the owner of the deadline."],["Is there a date the people who use the space care about that’s different from yours?","Look for an inspection, a visit, an opening or a busy season."],["Who decides when the space can come out of use, and for how long?","This is the person you need to meet."],["What does that part of the building look like in the weeks before the deadline?","The run-up to a deadline is often the busiest stretch."]]},{"t":"hear","rows":[["“The money has to be committed by then or we lose it.”","The date is about the paperwork, and the work date may have room. Ask what finish date the people using the space need."],["“The work has to be done before [event].”","That’s the real deadline. Build the schedule back from it."],["“We can’t shut that area down right now.”","Full access before the deadline is unlikely. You need a plan by area."],["The name of whoever controls the space","Ask for an introduction today."]]}],"note":{"label":"The paperwork deadline and its reason. The finish deadline and its reason. Who controls access.","ph":"Example: order must be placed this month. Work done before the inspection on the 12th. Facility lead controls the area."},"done":["I know what has to happen by the customer’s date.","I know the date the work has to be finished.","I have the name of the person who controls the space."]},{"title":"Bring in whoever controls the space","goal":"Build the schedule around the access the customer can give.","blocks":[{"t":"p","text":"The people who run the space can stop this job, and so far nobody has asked them. Ask what they can give up, when, and for how long. A small area they will release is worth more than a large one they promise and take back."},{"t":"say","label":"Ask your contact for the meeting","text":"Can we get [the person who runs the space] on a fifteen-minute call, or walk it together? I’d rather build the schedule around what they can give up than promise a date and then fight for access."},{"t":"say","label":"To the person who runs the space","text":"I don’t want to slow your operation down. Which areas could you run without, and when? Tell me what you can release and what time you need it back, and I’ll build the work around that."},{"t":"ask","title":"Ask them","items":[["How much of the space can be out of use at once?","Sets the size of each area."],["Which days and hours are lightest?","Nights and weekends are often the answer."],["When does each area have to be back in use?","Count dry time back from this."],["Who do my people call if an area is still in use when we arrive?","One name, one phone number."]]},{"t":"list","title":"Agree on","items":["The area: what it covers, marked on a sketch","The release window: day and time out, day and time back","The order of the areas that follow","One contact who releases each area"]},{"t":"avoid","items":["Accepting an area too small to keep a crew working a full shift.","Leaving dry time out of the hand-back time."]}],"note":{"label":"The area the customer will release, with release and hand-back times","ph":"Example: east wing, out Friday 6 p.m., back Monday 5 a.m."},"done":["Whoever controls the space was part of the conversation.","We agreed on a first area with release and hand-back times.","I have one access contact for the job."]},{"title":"Confirm what you can keep, then ask for the award","goal":"Give the customer a commitment tied to the released area, and ask them to award it.","blocks":[{"t":"p","text":"Now you can answer the original request. Say what will be complete by the deadline, say what the customer provides to make that true, and give the finish date for the rest. Then ask if that lets them award the work."},{"t":"say","label":"To your contact","text":"Here’s what I can confirm. [Area one] complete by [date], provided it is released from [day and time] to [day and time]. The remaining areas follow the schedule [name] agreed to, with everything complete by [date]. Does that let you award it?"},{"t":"say","label":"If someone else has to agree","text":"Who needs to sign off on that wording? I can send it to both of you so it’s one conversation."},{"t":"hear","rows":[["“That works.”","Ask when the award or purchase order will be issued and who should receive the schedule."],["“It has to say complete by the deadline.”","Say: “I can write complete by the deadline for [area one]. For the whole job I’d need every area released by [date]. Can they do that?”"],["“We may take it elsewhere.”","Say: “I understand. Whoever does the work will need the same access. I’d rather tell you that now than the week it’s due.”"]]}],"note":{"label":"The commitment you gave, in your words, and the customer’s award date","ph":"Example: east wing done by the 30th if released Friday night. Award expected Wednesday."},"done":["My commitment names the area, the date and the release window.","I asked for the award.","I have the customer’s date for the award, or I’ve written UNKNOWN."]},{"title":"Put the areas and windows in writing","goal":"Send one schedule to everyone who agreed to it, and brief production.","blocks":[{"t":"list","title":"Send today","items":["A schedule naming each area, its release window and its hand-back time","The customer contact who releases each area","One line on delays: if an area is released late, its dates move by the same amount","One email, sent to your contact and the person who controls the space together"]},{"t":"say","kind":"Email this","email":true,"text":"Subject: Painting schedule for [facility]\n\n[Contact] and [access contact], thank you both. Here is what we agreed.\n\nArea 1, [what it covers]: released [day and time], back in use [day and time].\nArea 2, [what it covers]: released [day and time], back in use [day and time].\n\n[Access contact] releases each area to our crew lead, [name]. If an area is released late, its dates move by the same amount, and I’ll confirm the new dates the same day.\n\n[Contact], please award the work against this schedule."},{"t":"p","text":"Give production the sketch and the access contact before the crew mobilizes."}],"done":["The schedule went to everyone who agreed to it, in one email.","The line on delays is in writing.","Production has the sketch and the access contact."]},{"title":"Stop this stall before it starts","goal":"Four changes earlier in the sale that keep you from promising a date you don’t control.","blocks":[{"t":"p","text":"Use these tips on your next job."},{"t":"stages","rows":[["At the first call","Ask who uses the space and who controls access to it. Ask to meet that person at the walk-through."],["At the walk-through","Walk it with the people who run the space. Ask about their busiest days and what can come out of use."],["In the proposal","State the duration as working days after each area is released. Leave out calendar dates you don’t control. Show the areas on a sketch."],["At the follow-up","Ask if there’s a budget period the order has to land in, so the deadline doesn’t arrive as a surprise."]]}]}]},{"id":"quiet","cls":"pb-quiet","tag":"Gone quiet","quote":"You’ve followed up. Nothing came back.","setting":"The proposal is out and your contact has stopped answering.","win":"A real conversation about what changed, then a next step the customer owns or a clean close.","rule":"Stop asking about your proposal. Ask about their business.","use":["Run it when the review says","RE-ENGAGE. There is no credible sign of an active customer process."],"steps":[{"title":"Read the silence","goal":"Plan a different kind of contact before you reach out again.","blocks":[{"t":"p","text":"Another message like the last ones will get the same result. When a buyer goes quiet after a proposal, there is usually news they would prefer not to deliver: the budget moved, a priority changed, or someone above them said no."},{"t":"p","text":"Change two things. Change the channel: call, or stop by. Change the subject: ask about their business."},{"t":"p","text":"Before you reach out, find something real to ask about: an event on their calendar, a busy season, an inspection, a move."},{"t":"avoid","items":["Another “just following up” message.","Guilt, such as “I haven’t heard back from you.”","A discount offered to get a reaction."]}],"note":{"label":"Something coming up in their business that you can ask about","ph":"Example: lease renewals in the spring, an inspection next month"},"done":["I’ve found something coming up in their business.","I have a question ready that isn’t about my proposal."]},{"title":"Ask about their business","goal":"Start a conversation your contact wants to have.","blocks":[{"t":"p","text":"People will talk about their own operation all day. Ask how the space gets used and you get a tour of what they care about. Then make it safe to give you bad news about the project."},{"t":"say","label":"On the phone or in person","text":"I’m not calling to chase the proposal. I was thinking about [what’s coming up for them]. When that happens, which spaces matter most?"},{"t":"say","label":"If you can only reach them in writing","text":"Quick question, and it isn’t about the proposal. With [what’s coming up] ahead, which spaces do people see first?"},{"t":"say","label":"Make it safe to say no","text":"And if the project is off the table for now, it’s fine to tell me. I’d rather know than keep filling your inbox."},{"t":"hear","rows":[["Your contact starts describing what matters","Listen, then move to Discover."],["“Sorry, I’ve been meaning to get back to you.”","Say: “No apology needed. What’s changed since we last talked?”"],["Still nothing after a call and a message","Wait a week. Send one short note saying you’ll close the file for now and check back next quarter. Then do that."]]}],"done":["My contact is talking with me again, or I have closed the file."]},{"title":"Find what still matters","goal":"Learn what happened to the project, and what still needs doing.","blocks":[{"t":"p","text":"Stay on their business until the conversation is warm, then ask about the project once and plainly. A frozen budget rarely freezes every dollar."},{"t":"ask","items":[["Which spaces do your customers, tenants or visitors notice most?","Points you to the work that still pays for itself."],["What do people comment on when they walk through?","Shows you the space that costs them something."],["What happened with the project?","Ask it once, plainly, after the conversation is warm."],["Is the freeze on everything, or on capital projects?","Repair and maintenance money often keeps moving when capital stops."],["If you could fix one thing before [what’s coming up], what would it be?","The answer is your smaller job."]]},{"t":"hear","rows":[["“The budget is frozen.”","Thank them for telling you. Ask how long, and what is still open."],["A smaller area that still matters, with a date attached","Go to Reshape."],["“Nothing moves until next year.”","Ask when next year’s budget is set and who puts projects on the list. Get their date for that."],["“We went with someone else.”","Thank them, ask what decided it, and close the file."]]}],"note":{"label":"What’s on hold and until when. The space that still matters, and the date it matters by.","ph":"Example: capital on hold to January. Main entry matters before the open house on the 6th."},"done":["I know what happened to the project.","I know which space still matters to my contact.","I know the date that space has to look right, or I’ve closed the file."]},{"title":"Park the big job, scope a small one","goal":"Offer a small job that fixes something people can see.","blocks":[{"t":"p","text":"Set the stalled project aside out loud, so your contact doesn’t feel chased. Then offer the small one: visible, quick, and done without disrupting them. A small job done well is also your best case for the full project when the budget opens."},{"t":"say","label":"Park the big job","text":"Let’s set the full project aside until the budget opens. I’ll hold the numbers, and you tell me when to bring them back."},{"t":"say","label":"Offer the small one","text":"What if we took care of [the area that still matters]? It’s [duration] of work. We’d do it [when it’s least disruptive], and it would be ready before [their date]."},{"t":"list","title":"What makes it easy to approve","items":["People see it every day","It’s done without taking the space out of use","It’s finished before a date the customer already cares about","It’s priced as its own job on one page"]},{"t":"avoid","items":["Bundling the small job with part of the big one to make it bigger.","Pricing it as a favor. Use your normal rates."]},{"t":"owner","text":"Before you bring the full project back, check how old its price is. If it’s more than 60 days old, bring it to the Owner. The Owner decides whether to hold the price or reprice."}],"note":{"label":"The small job, its price, and the date it must be ready","ph":"Example: main entry walls and trim, two days midweek, ready by the 4th"},"done":["I told my contact the full project is on hold.","I offered the small job on its own, with a ready-by date.","My contact is interested."]},{"title":"Find the approver and ask","goal":"Learn who can approve a job this size, then ask for the agreement.","blocks":[{"t":"p","text":"A budget freeze doesn’t stop every approval. Many managers can sign for small repairs on their own. Ask where the line is, then ask for the job. Interest without an ask turns into more silence."},{"t":"say","label":"Find the approver","text":"Who can approve something this size? Is that within your budget, or does it still go to someone above you?"},{"t":"say","label":"If your contact can approve it","text":"If I get the agreement to you this afternoon, when can you sign it? Knowing that lets me get you on the schedule ahead of [their date]."},{"t":"say","label":"If it goes to someone else","text":"What do they need from us? I can send you one page with photos, or you and I can call them together."},{"t":"hear","rows":[["“I can approve that.”","Ask for the signature and offer two start dates."],["“Anything over [amount] goes higher.”","Ask if the small job fits under that amount as scoped. If it’s close, adjust the scope and keep your rates."],["“Send it over and I’ll take a look.”","Say: “I’ll have it to you by [time]. When should I call to answer questions and get you scheduled?”"]]}],"note":{"label":"Who approves and their limit. What you asked for, and the answer.","ph":"Example: manager signs repairs under their limit. Asked for a signature this week."},"done":["I know who can approve the small job.","I asked for the agreement.","I have a yes, or the customer’s date for an answer."]},{"title":"Send it today and schedule around their operation","goal":"Get the one-page agreement out, and line production up with the customer’s calendar.","blocks":[{"t":"list","title":"Send today","items":["A one-page agreement for the small job: scope, price and ready-by date","Two start dates that work around their operation","A line confirming the full project is on hold, and when you’ll check back"]},{"t":"say","kind":"Email this","email":true,"text":"Subject: [Small job] before [their date]\n\n[Name], thanks for walking me through what’s coming up. Attached is a one-page agreement for [the small job]: [scope], [price], finished by [date].\n\nWe can start [date] or [date]. The full project stays on hold until you tell me the budget has opened, and I’ll check back with you in [the month you named].\n\nI’ll call [day] at [time] to get you on the schedule."},{"t":"p","text":"Ask for their calendar and pass it to production. Treat the small job as the audition for the full project."}],"done":["The agreement went out today.","Production has the customer’s calendar.","My reminder to bring the full project back is set."]},{"title":"Stop this stall before it starts","goal":"Four changes earlier in the sale that keep a proposal from going quiet.","blocks":[{"t":"p","text":"Use these tips on your next job."},{"t":"stages","rows":[["At the walk-through","Ask which budget the work comes from, capital or repair and maintenance, and what your contact can approve alone."],["In the proposal","Offer a small first job next to the full scope, so a freeze still leaves you something to talk about."],["When you send it","Book the review call before you send the proposal: “I’ll walk you through it Thursday at two.”"],["At the follow-up","After two unanswered messages, change the channel and the subject. Skip the third."]]}]}]},{"id":"nextyear","cls":"pb-nextyear","tag":"Next year’s budget","quote":"“We’ll have to look at it next year.”","setting":"The customer wants the work, but the money isn’t there until a later budget is approved.","win":"A place in next year’s budget, the date it’s decided, and a price that holds or a plan to reprice.","rule":"Get into their budget before it’s set.","use":["Run it when","The money depends on a budget that isn’t approved yet."],"steps":[{"title":"Find out what “next year” means","goal":"Learn the budget calendar before you decide anything.","blocks":[{"t":"p","text":"“Next year” can mean the budget is set next month or in nine months. It can mean the project is already in the draft budget, or that nobody has asked for it yet. Each one calls for a different move, and the timing decides whether your price still holds."},{"t":"avoid","items":["Treating “next year” as a no.","Treating it as a yes and waiting.","Leaving the price open with no hold date."]}],"done":["I know I need the budget calendar before anything else."]},{"title":"Ask about their budget, not your proposal","goal":"Get the customer talking about how next year’s money gets decided.","blocks":[{"t":"say","label":"On the phone","text":"That makes sense. So I can plan around it, how does next year’s budget come together? When is it drafted, and when is it approved?"},{"t":"hear","rows":[["“The board approves it in [month].”","Move to Discover and work back from that month."],["“I’m not sure yet.”","Ask who would know, and when you can ask them."],["“It may not make the budget.”","Ask what would put it in. That’s your Discover step."]]}],"done":["I know when next year’s budget is drafted and approved, or I’ve written UNKNOWN."]},{"title":"Learn what gets a project into the budget","goal":"Find out who builds the budget, what they need, and when.","blocks":[{"t":"ask","items":[["Who puts projects on the budget list, and when do they need numbers?","The date your budget figures have to arrive."],["Is this capital money, or repair and maintenance?","Repair and maintenance money sometimes moves before capital."],["Does the whole project have to fit in one year, or can it be phased?","A phase may fit this year or next."],["Is any money available this year for part of it?","A small first job keeps you in place."],["Will you get other bids before it goes in the budget?","Tells you if your figure becomes the one others are measured against."]]},{"t":"hear","rows":[["A date for budget numbers","That’s the customer’s date. Get your figures in a week before it."],["“We could do part of it now.”","Go to Reshape and scope the first phase."],["“We’ll bid it out once it’s approved.”","Your figure may set the budget others bid against. Make it complete."]]}],"note":{"label":"Budget calendar: draft date, approval date, who builds it, type of money","ph":"Example: draft due in January, board approves in March, capital"},"done":["I know who builds the budget and when numbers are due.","I know if the project can be phased."]},{"title":"Give them a budget figure that holds","goal":"Turn your proposal into budget figures by phase, with a plan for price changes.","blocks":[{"t":"p","text":"A budget figure has to survive months of review. Give a figure for each phase, say how long it holds, and say how you’ll update it if the work moves."},{"t":"list","title":"What to send","items":["A figure for each phase, so the budget can fund one at a time","How long the price holds, and how you’ll reprice if the work moves past it","Why it shouldn’t wait: what gets worse or more expensive, with photos","A small first job they could fund this year, if there is one"]},{"t":"owner","text":"If your price is more than 60 days old, or the budget decision falls after your price hold, bring it to the Owner. The Owner decides whether to hold the price, reprice now, or give a budget range."},{"t":"avoid","items":["One lump sum for the whole job.","Letting an old price stand with no hold date."]}],"done":["The budget figures are phased.","The price hold or the plan to reprice is written down."]},{"title":"Get the date the budget is decided","goal":"The customer owns getting it into the budget, and tells you when that’s decided.","blocks":[{"t":"say","label":"Ask for the commitment","text":"If I get you the budget figures by [date], can you put this in the draft budget? When will you know if it’s approved?"},{"t":"say","label":"If there’s money this year","text":"Would it help to do [first phase] this year from the repair budget, and put the rest in next year’s?"},{"t":"hear","rows":[["A budget approval date","That’s the customer’s date. The deal is moving."],["“I’ll submit it.”","Ask when it goes in, and when it’s decided."],["“It probably won’t make it.”","Ask what would. If nothing, set a review date and check back before the next budget cycle."]]}],"done":["The customer committed to putting it in the budget.","I have the date the budget is decided, or I’ve written UNKNOWN."]},{"title":"Put the figures and the dates in writing","goal":"Send the budget figures today, and put the customer’s budget dates on your calendar.","blocks":[{"t":"list","title":"Send today","items":["The budget figures by phase, with the price hold","The customer’s budget dates, repeated back to them"]},{"t":"say","kind":"Email this","email":true,"text":"Subject: Budget figures for [property]\n\n[Name], here are the budget figures for next year’s plan.\n\nPhase 1: [scope], [price].\nPhase 2: [scope], [price].\n\nThese hold until [hold date]. If the work moves past that, I’ll update them before your [budget meeting].\n\nYou said the budget is approved in [month]. I’ll check in with you on [date], the week after."},{"t":"p","text":"Put two dates on your calendar: a week before their budget deadline, and the day after it’s approved."}],"done":["The budget figures went out today.","Both dates are on my calendar."]},{"title":"Stop this stall before it starts","goal":"Three changes earlier in the sale that get you into the budget on time.","blocks":[{"t":"p","text":"Use these tips on your next job."},{"t":"stages","rows":[["At the first meeting","Ask which budget the work comes from and when it’s set."],["In the proposal","Price by phase, and put a hold date on every price."],["Every year","Before the customer’s budget season, send updated figures for work they deferred."]]}]}]},{"id":"gc","cls":"pb-gc","tag":"GC bid and award","quote":"“Get us your number by bid day.”","setting":"A general contractor is bidding the project to an owner. You’re pricing the painting as a subcontractor.","win":"A complete, qualified number on bid day, and a scope review with the GC that wins.","rule":"Price the documents, qualify the gaps, and know who you’re bidding to.","use":["Run it when","A general contractor awards the work."],"steps":[{"title":"Decide if this bid is worth it","goal":"Know what you’re bidding before you spend hours on it.","blocks":[{"t":"p","text":"GC bids move fast and reward the subs who know the job. Before you start, find out what the project is, who the owner is, how many GCs are bidding, and when bids are due."},{"t":"ask","items":[["Who is the owner, and is this a hard bid or a negotiated job?","A hard bid is decided mostly on price."],["How many GCs are bidding, and can you bid to all of them?","Each GC that might win is a chance at the work."],["When is the sub bid due, and when is the owner’s bid due?","Your number is due before theirs."],["Are there drawings, specifications and a finish schedule?","You price the documents, not the walk-through."]]},{"t":"owner","text":"If the job is over $75,000, or there’s a bonding, prevailing wage or contract question, bring it to the Owner before you bid. The Owner decides whether to bid."}],"done":["I know the owner, the GCs and the due dates.","I have the drawings and specifications.","The Owner decided on anything that triggered."]},{"title":"Get on each GC’s bid list","goal":"Introduce yourself to each GC’s estimator and get the full bid package.","blocks":[{"t":"say","label":"To the estimator","text":"I’m pricing the painting for [project]. Can you add me to your bid list and send the full package, including addenda? Who should I send questions to, and when is your deadline for sub bids?"},{"t":"hear","rows":[["A deadline and a contact","Write both down. That’s the GC’s date."],["“We already have three painters.”","Ask if they’ll take another number, and by when."],["“Use the plan room link.”","Download everything, and sign in so you receive the addenda."]]}],"done":["I’m on each GC’s bid list.","I have the full package and the addenda."]},{"title":"Read the specs and ask questions early","goal":"Find what the documents require and what they leave unclear, before the question deadline.","blocks":[{"t":"p","text":"In GC bids the painting scope hides in three places: the specification, the finish schedule and the notes on the drawings. Read all three."},{"t":"list","title":"Check","items":["The painting specification: products, coats, film thickness and approved manufacturers","The finish schedule: which surfaces get which system","Who paints what: doors, frames, mechanical, structural steel, factory-finished items","Working hours, phasing and the schedule","Insurance, bonding, prevailing wage and payment terms"]},{"t":"say","label":"Send questions in writing, before the deadline","text":"On [sheet or section], the finish schedule shows [X] but the specification says [Y]. Which should we price?"},{"t":"hear","rows":[["An addendum answers it","Price the addendum."],["No answer before bid day","Price what the documents say, and write the question into your qualifications."]]}],"note":{"label":"Scope questions, exclusions and qualifications","ph":"Example: excludes factory-finished doors; assumes one color per room"},"done":["I’ve read the specification, the finish schedule and the drawing notes.","My questions went in before the deadline."]},{"title":"Build a clean, qualified number","goal":"Give the GC a number they can compare easily, with your inclusions and exclusions spelled out.","blocks":[{"t":"p","text":"GCs compare sub bids line by line on bid day. A number with a clear scope sheet often beats a slightly lower one with surprises."},{"t":"list","title":"Your bid includes","items":["A base bid, with alternates priced separately if the documents ask for them","Inclusions and exclusions on one page","The addenda you priced, by number","How long your price holds","Any prevailing wage, bonding or insurance cost the documents require"]},{"t":"owner","text":"Before your number goes out, the Owner decides on anything over $75,000, any bond, and any prevailing wage, contract or production rate question."},{"t":"avoid","items":["Leaving out which addenda you priced.","Burying exclusions in fine print.","Cutting your number on bid day without cutting scope."]}],"done":["My bid lists inclusions, exclusions and addenda.","The Owner decided on anything that triggered."]},{"title":"Submit on time, then learn the award date","goal":"Get your number in before the deadline, and find out when the GC will know.","blocks":[{"t":"p","text":"After bid day the GC owns the next step: they learn if they won, then pick their subs. Ask when that happens."},{"t":"say","label":"When you submit","text":"Our number is attached, with our scope sheet. When will you hear from the owner, and when do you pick your subs?"},{"t":"say","label":"After the owner awards","text":"Congratulations on [project]. When are you reviewing scope with your subs? I’d like to go through ours with you."},{"t":"hear","rows":[["A date for the owner’s award","That’s the customer’s date. Check back the day after."],["“You’re a little high.”","Ask which part, and whether they’re comparing the same scope. If they want a lower number for the same scope, bring it to the Owner."],["“We didn’t win it.”","Ask who did, and offer your number to that GC if they’ll take it."]]}],"done":["My number went in on time.","I know when the GC expects the owner’s award, or I’ve written UNKNOWN."]},{"title":"Review scope with the winning GC","goal":"Before you sign the subc
