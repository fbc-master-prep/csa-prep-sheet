/* CROSSWALK: for each playbook, the master step that each of the 18 standard suggestions is built
   from: six questions, three suggestions each. "@4" is step 4 of the job's own playbook,
   "review:5" is Review the job step 5, "habit:1" is the first of the five habits. A "!" means the
   standard suggestion does not belong to that playbook, so a new one is written from the step.
   "none" is used when no playbook fits yet: the standard suggestions with their own sources. */
const CROSSWALK={
  none:    [["review:5","approval:4","before:4"],["approval:2","habit:1","review:1"],["approval:3","approval:7","deadline:4"],["before:3","before:2","review:3"],["approval:3","before:3","before:3"],["approval:5","review:6","review:6"]],
  before:  [["review:5","@1!","@4"],["@2!","habit:1","review:1"],["review:3","@4","review:4!"],["@3","@2","review:3"],["@5","@3","@3"],["@5","@6!","review:6"]],
  price:   [["review:5","@4","@1"],["@2!","@3","review:1"],["review:3","@4","@5"],["before:3","@5","review:3"],["@6","@3","@2"],["@6","review:6","review:6"]],
  approval:[["review:5","@4","before:4"],["@2","@1","review:1"],["@3","@7","@4"],["before:3","before:2","review:3"],["@3","before:3","before:3"],["@5","@6","review:6"]],
  deadline:[["review:5","@4","@6"],["@1!","@2","review:1"],["review:3","@3","@4"],["@3","before:2","review:3"],["@5","before:3","before:3"],["@5","review:6","review:6"]],
  quiet:   [["review:5","@4","before:4"],["@2","@1","review:1"],["@3","review:3!","review:4!"],["before:3","@5!","review:3"],["@3","before:3","before:3"],["@5","@6","review:6"]],
  nextyear:[["review:5","@4","before:4"],["@2","@1","review:1"],["@3","@4","@2"],["@3","before:2","review:3"],["@5","before:3","before:3"],["@5","@6","review:6"]],
  gc:      [["@1","@3!","@4"],["@2","habit:1","review:1"],["review:3","review:4!","@2"],["@1","@3!","review:3"],["@5","@6!","@4"],["@5","review:6","review:6"]],
  "public":[["@1","@3!","@4"],["@5","habit:1","review:1"],["review:3","review:4!","@2"],["@2","@5!","review:3"],["@6","@4!","@1"],["@6","review:6","review:6"]]
};

/* ── the master playbooks in the background ── */
const pbOf=id=>BOOK.playbooks.find(p=>p.id===id)||null;
/* the master's own selector, unchanged: which playbook fits the job */
function selectPlay(s1,s2,s3){
  if(s2==="gc")return {id:"gc",why:"A general contractor awards the work."};
  if(s2==="public")return {id:"public",why:"A public agency awards it through a formal bid."};
  if(s1==="no"&&s2==="owner")return {id:"before",why:"The proposal has not been sent."};
  if(!(s1&&s2&&s3))return null;
  if(s3==="none")return {id:null,why:"None of the plays fits yet. Choose DISCOVER and learn what’s happening."};
  const o=BOOK.selector.q[2].opts.find(x=>x[0]===s3);
  return {id:s3,why:o?"The customer’s last words: "+o[1]+".":""};
}
/* a crosswalk entry as a step of the master */
function refOf(code,playId){
  const m=/^(@|[a-z]+:)(\d+)(!?)$/.exec(code);
  return {book:m[1]==="@"?playId:m[1].slice(0,-1),n:+m[2],replace:m[3]==="!"};
}
function refLabel(r){
  if(r.book==="habit")return BOOK.habitsTitle+": "+BOOK.habits[r.n-1][0];
  const pb=pbOf(r.book);
  return pb.tag+", step "+r.n+": "+pb.steps[r.n-1].title;
}
const slotRef=(playId,qi,si)=>refOf(CROSSWALK[playId||"none"][qi][si],playId);
/* a master step as plain lines for Claude. These documents name no role but CSA and Owner, so any
   line of the master that names another role is left out. */
const bookText=s=>String(s==null?"":s).replace(/\byou and your coach\b/gi,"you").replace(/\s*\n+\s*/g," / ").trim();
const bookOk=s=>!!s&&!/\bFBCs?\b|coach/i.test(s);
function blockLines(b){
  const L=[],add=s=>{s=bookText(s);if(bookOk(s))L.push(s);};
  if(b.t==="p")add(b.text);
  else if(b.t==="say")add((b.email?"Email":"Words")+(b.label||b.kind?" ("+(b.label||b.kind)+")":"")+": "+b.text);
  else if(b.t==="ask")(b.items||[]).forEach(it=>add("Ask: "+it[0]+(it[1]?" ("+it[1]+")":"")));
  else if(b.t==="hear")(b.rows||[]).forEach(r=>add("If you hear: "+r[0]+" Then: "+r[1]));
  else if(b.t==="list")add((b.title||"List")+": "+(b.items||[]).join("; "));
  else if(b.t==="avoid")add((b.title||"Avoid")+": "+(b.items||[]).join(" / "));
  else if(b.t==="stages")(b.rows||[]).forEach(r=>add((b.title?b.title+": ":"")+r[0]+": "+r[1]));
  else if(b.t==="owner")add("Owner decides: "+b.text);
  else if(b.t==="example")add((b.title||"Example")+": "+b.text);
  else if(b.t==="choice")(b.opts||[]).forEach(o=>add(b.title+": "+o[0]+": "+o[1]));
  else if(b.t==="rate")add(b.title+": "+b.q+(b.note?" "+b.note:""));
  else if(b.t==="form")add((b.title||"Write down")+": "+(b.fields||[]).map(f=>f.label+(f.hint?" ("+f.hint+")":"")).join("; "));
  else if(b.t==="readiness")BOOK.readiness.forEach((r,i)=>add("Readiness Check "+(i+1)+(r.crit?" (critical)":"")+": "+r.q+" Evidence: "+r.ev));
  else if(b.t==="triggers")BOOK.triggers.forEach(t=>add("Bring it to the Owner when: "+t.text));
  else if(b.t==="flow")add(b.title+": "+(b.items||[]).join(" > "));
  return L;
}
function stepText(r){
  if(r.book==="habit")return [refLabel(r),"What to do: "+BOOK.habits[r.n-1][1]];
  const pb=pbOf(r.book),st=pb.steps[r.n-1],L=[refLabel(r),"What to do: "+bookText(st.goal)];
  st.blocks.forEach(b=>blockLines(b).forEach(x=>L.push(x)));
  (st.done||[]).forEach(d=>{if(bookOk(d))L.push("Done when: "+bookText(d));});
  const w=(BOOK.wnw[r.book]||[])[r.n-1];
  if(w&&w[0])L.push("The customer’s next step at this point: "+w[0]+" Who: "+w[1]+". When: "+w[2]+".");
  const d=pb.kind==="review"?null:BOOK.detail.find(p=>p.id===r.book),ds=d&&r.n<=6?d.steps[r.n-1]:null;
  if(ds){
    const more=[];
    ds.blocks.forEach(b=>{if(b.t!=="owner")blockLines(b).forEach(x=>more.push("- "+x));});
    if(more.length)L.push("More from this step, for wording only:");
    more.forEach(x=>L.push(x));
  }
  return L;
}
window.__wnwBook={BOOK:BOOK,CROSSWALK:CROSSWALK,selectPlay:selectPlay,refLabel:(c,p)=>refLabel(refOf(c,p)),stepText:(c,p)=>stepText(refOf(c,p))};

  ["Ask what the other bid spells out","You are asking what is in it, not asking to see it.","Does the other proposal spell out prep, coats, working hours and how the site stays in use?"]]},
 "3.2":{t:"Put the most-needed work first",why:"If the budget can’t cover it all, the first phase should be the areas the customer most needs. That keeps your price whole and gives them a real choice.",o:[
  ["Walk the site and rank the areas","Rank them with your contact and take photos. The top areas become phase one."],
  ["Rank them from your notes and send it","Ask your contact to confirm or correct the order before you price the smaller scope."],
  ["Ask which areas they’d do first","Write down the order and the reasons.","Which areas are in the worst shape, and which would you do first?"]]},
 "3.3":{t:"Find who approves it and when",why:"A smaller job may fall under a different approval limit. Learn who signs and when, so you know how soon work could start. Promise no crew date that production hasn’t checked.",o:[
  ["Ask who can approve the smaller option","Write down the name and their limit.","If the smaller scope fits, who authorizes it? Is that you, or does it go to someone else?"],
  ["Get the lead time from production","Ask the Owner or production how many weeks they need from approval to start."],
  ["Add a “decide by” line","Once you have both, write: to start in [their window], we need approval by [date]. Call it your planning date, not theirs."]]},
 "4.2":{t:"Help your contact take it to the approver",why:"If someone above your contact signs, find out what that person needs and make it easy to forward.",o:[
  ["Ask what the approver needs to see","Write it down.","What do they need to see to say yes?"],
  ["Send a one-page summary to forward","The smaller scope, the price, and how you protect what matters to them, on one page."],
  ["Offer a call with the approver","Go through your contact, not around them.","Would it help if we called them together?"]]},
 "5.1":{t:"Send the options and get a decision date",why:"Send the revised work and price by the time you promised, and ask when they expect to decide.",o:[
  ["Ask when they will decide","Write the date down in their words.","If I get you the revised scope by [day], when can you decide?"],
  ["Send both options in writing","The smaller scope and the full scope, each with its price and how long it holds."],
  ["No date? Write UNKNOWN and set your own","Put your own review date on the calendar. Never pass it off as theirs."]]},
 "5.2":{t:"Learn if there is a budget ceiling",why:"If there is a hard number, explaining your price won’t close the gap. A smaller job will.",o:[
  ["Ask if there is a number to stay under","Write down the number and who told you.","Is there a budget number you have to stay under?"],
  ["Ask which budget pays for it","Repair money and capital money can move differently.","Which budget does this come from?"],
  ["Ask when more money opens up","That date becomes phase two.","If the rest can’t fit this year, when could it?"]]},
 "5.3":{t:"Compare the bids on the same work",why:"Check whether the bids price the same job, without asking to see the other one. Then learn what decides it besides price.",o:[
  ["Ask if both bids cover the same scope","Write down what they tell you.","Do both proposals include the same prep, coats and working hours?"],
  ["Offer a scope sheet with no prices","If they say yes, send it the same day with no pricing on it.","Would it help if I sent a one-page scope sheet, so the bids can be compared on the same work?"],
  ["Ask what matters most besides price","Write the answer into your summary as its own line.","What will matter most when you choose a contractor?"]]},
 "6.1":{t:"Get their choice and their date",why:"The customer chooses an option and gives a date. Your follow-up is your step, not theirs.",o:[
  ["Ask which option they prefer and when","Write it down in their words.","Which option works better for you, and when do you expect to decide?"],
  ["Tie your next call to their date","Then keep your word and stay quiet until that day.","I’ll call you the day after, and I’ll leave you alone until then."],
  ["Confirm it in writing","Send it after the call.","Attached are the options we discussed. You preferred [option]. [Name] will [action] by [their date or UNKNOWN]. I will [your action] by [your date].","W"]]}
},
approval:{
 "1.2":{t:"Give the approvers only what’s missing",why:"If the full job can’t be approved, a smaller first phase is easier to defend. Offer it only if it solves the approval problem.",o:[
  ["Ask which part your contact can defend","Their answer is your first step.","If you had to stand up and defend this, which part could you defend today? Why that part?"],
  ["Write a one-page summary for the approvers","Why this part first, why now, the price, and the rest as later phases, in your contact’s words."],
  ["Send a phase one proposal","Phase one is the whole scope and the total. The rest moves to a short phase plan. Get the Owner’s price decision first."]]},
 "2.1":{t:"Ask where the approval sits",why:"“Waiting on approval” can mean nobody has presented it, it stalled, something else took priority, or they want more bids. Ask your contact, and make it easy to tell you the truth.",o:[
  ["Call your contact this week","Call. Don’t wait for them to call you.","Can I ask where it sits right now? Have the approvers looked at it, or is it still waiting for a slot?"],
  ["Ask at your next planned contact","Use this when you already talk on a schedule. If the date passes, call.","What approval is still needed, and is there anything missing that we can help with?"],
  ["Send one short question in writing","A note they can answer in one line.","Quick question so I can plan: have the approvers seen the proposal yet, or is it still waiting for a meeting?","W"]]},
 "2.2":{t:"Work out what “waiting” really means",why:"Read the last update and name the approval still needed. If the customer is working through a known process and needs nothing from you, waiting can be right.",o:[
  ["Ask which approval is still needed","Write it down in their words.","Before I send anything else, which approval is still needed?"],
  ["Ask if they want more bids first","If yes, that is routine. Offer a scope sheet with no prices.","Do the approvers need more than one bid before they decide?"],
  ["Ask what came up if it stalled","Help your contact answer those questions.","If they looked at it and didn’t decide, what questions did they have?"]]},
 "3.1":{t:"Help your contact answer “why now”",why:"The approvers will ask why now. Give your contact what they need to answer it.",o:[
  ["Make a photo page of the worst areas","Use the proposal’s photos and your own. Label each one by area."],
  ["List what waiting changes","In plain words, from the proposal and what you saw. Leave out dollar figures you can’t back up."],
  ["Ask what the approvers will push back on","Answer it in writing before the meeting.","What will the approvers push back on?"]]},
 "3.2":{t:"Rank the areas so part can be defended",why:"When the whole job can’t go at once, the first part has to be one your contact can defend. Ranking the areas together gives them the reason.",o:[
  ["Walk the site with your contact","Rank the areas on site and take photos."],
  ["Rank them from your notes and send it","Ask your contact to confirm or correct the order."],
  ["Ask by phone","Write down the order and the reasons.","Which area is in the worst shape, and which would you do first?"]]},
 "3.3":{t:"Show the approvers the lead time",why:"Crews take time to line up. That is an honest reason to decide sooner, and it belongs on the page your contact carries in.",o:[
  ["Ask what start date they have in mind","That date is theirs. If they don’t know, write UNKNOWN.","If this is approved, when would you want the work to start?"],
  ["Get the lead time from production","Ask the Owner or production how many weeks they need from approval to start."],
  ["Add a “decide by” line to the summary","To start in [their window], we need approval by [date]. Call it your planning date, not theirs."]]},
 "5.1":{t:"Get the approval meeting date",why:"The approvers decide on some date. Every other date works back from it.",o:[
  ["Ask when they meet and how to get on it","Write the date down in their words.","When is the next meeting or review, and what does it take to get this on it?"],
  ["Ask what they need, and by when","Get it to your contact a few days ahead.","What will the approvers need to feel comfortable approving this, and when do they need it?"],
  ["No date? Write UNKNOWN and set your own","Ask what has to happen first. Put your own review date on the calendar. Never pass it off as theirs."]]},
 "6.1":{t:"Agree whether to act or wait",why:"If your contact has what they need, respect their process. Record the approval event, who owns it, and their date or UNKNOWN.",o:[
  ["Ask what else they need from you","If the answer is nothing, believe it.","What else do you need from me to take this forward?"],
  ["Tie your next call to their date","Then keep your word and stay quiet until that day.","When do you expect it to be decided? I’ll call you the day after, and I’ll leave you alone until then."],
  ["Confirm the wait in writing","Two lines: the approval event and their date, then what you will do and by when."]]},
 "6.2":{t:"Set your own review date while you wait",why:"When the customer’s date is UNKNOWN, set your own date to look again. Don’t add a call unless there is a useful reason.",o:[
  ["Two weeks out","Start the review with: “Last time, the next move was [next move]. What’s changed?”"],
  ["One week out, because something is urgent","Use this when the price has run out, a meeting is close, or the Owner has a decision to make."],
  ["The day after their meeting","Use this once you know the meeting date.",null,null,"Until you have it, keep the two-week date."]]}
},
deadline:{
 "1.2":{t:"Size the first area to the access you get",why:"If the whole job can’t finish by the date, a smaller first area that production has checked is a commitment you can keep.",o:[
  ["Ask which areas must be ready first","Write down the areas and the date.","Which areas have to be ready by the date, and which can follow?"],
  ["Have production check the first area","Crew size, prep, drying time and access. Confirm nothing until they check."],
  ["Offer a sequence by area","Let them choose the order.","Our team needs [access window] for [area]. Could you provide that, or should we do a smaller area first?"]]},
 "1.3":{t:"Show the job as a schedule by area",why:"Lay the job out as areas, each with its access window and finish date, so the customer sees what is done by their date.",o:[
  ["List each area with its window","Each area, when it is released, when it comes back, and its price if priced separately."],
  ["Mark the areas on a sketch","One sketch of the site with each area numbered in order."],
  ["Add one line on delays","If an area is released late, its dates move by the same amount. Write that in."]]},
 "2.1":{t:"Don’t confirm the date yet",why:"The award may be one reply away, but you can only finish on time if the customer gives you the space. Ask two questions and count the working days before you answer.",o:[
  ["Call and ask two questions first","Call. Don’t settle this by email.","I want to give you a yes I can keep. Can I ask two quick questions about the date before I confirm it?"],
  ["Count the working days with production","Work out what you could finish with full access, and what it depends on. If the production rate is in doubt, take it to the Owner."],
  ["Promise a firm answer by a set time","Send it today.","Got your note. I’ll give you a firm answer by [time]. I need one thing first: who decides when we can have the space?","W"]]},
 "2.2":{t:"Find out what the date is for",why:"Two deadlines often hide in one sentence: when the order has to be placed, and when the work has to be done. Each belongs to a different person.",o:[
  ["Ask what happens on that date","Write down both dates if there are two.","What happens on your side on that date? Is that when the order has to be placed, or when the work has to be finished?"],
  ["Ask who set the date","That person may be the one you need to meet.","Who set that date, and what is it tied to?"],
  ["Ask which areas must be ready","The rest may have room.","Which areas have to be ready for that date?"]]},
 "3.2":{t:"Order the work by when space is free",why:"The order of the work follows the access the customer can give. Ask what can come out of use, when, and for how long.",o:[
  ["Walk the site with whoever runs the space","Agree the areas on a sketch, with release and hand-back times."],
  ["Send a draft order of areas","From your notes. Ask your contact and the person who runs the space to correct it."],
  ["Ask which days and hours are lightest","Nights and weekends are often the answer.","Which days and hours could you run without that area?"]]},
 "3.3":{t:"Show the working days the job needs",why:"Crews, prep and drying time set how long it takes. Put a number on it so the customer can see what their date allows.",o:[
  ["Ask when the work could start","Write down their answer.","If this is approved, when could we start, and when would the space be free?"],
  ["Get the working days from production","Ask how many working days each area needs after it is released."],
  ["Add a “decide by” line","To finish by [their date], we need approval by [date] and the first area by [date]. Call it your planning date."]]},
 "4.1":{t:"Find who controls the space",why:"The person asking for the date often doesn’t control the space. Find who does, and meet them.",o:[
  ["Ask who releases each area","Write down the name.","Who decides when the space can come out of use, and for how long?"],
  ["Ask for an introduction","Fifteen minutes is enough.","Can we get [name] on a fifteen-minute call, or walk it together?"],
  ["Agree one access contact","One name your crew lead can call if an area isn’t ready."]]},
 "5.1":{t:"Get the award date against the schedule",why:"Confirm what you can finish with the access agreed, then ask when they will award it.",o:[
  ["Confirm what you can keep, then ask","Name the area, the date and the release window.","We can finish [area] by [date] if it’s released [window]. Does that let you award it?"],
  ["Ask who signs off on the wording","Send it to both of them as one conversation.","Who needs to sign off on that schedule?"],
  ["No date? Write UNKNOWN and set your own","Put your own review date on the calendar. Never pass it off as theirs."]]},
 "6.1":{t:"Get the release date for the first area",why:"The deal is moving when the customer owns releasing the first area and gives the date.",o:[
  ["Ask when the first area is released","Write the date in their words.","When can [area] be released to us, and who releases it?"],
  ["Ask when the award will be issued","Write down who gets the schedule.","When will the award or purchase order be issued, and who should get the schedule?"],
  ["Send the schedule to everyone who agreed","One email to your contact and the access contact: areas, windows and the line on delays."]]}
},
quiet:{
 "1.2":{t:"Park the big job, offer a small one",why:"Set the stalled job aside out loud so your contact doesn’t feel chased. Offer a small job that fixes something people can see, only if they want it.",o:[
  ["Ask if one small fix would help now","Listen before offering anything.","Would [specific smaller job] help now, or would it be better to pause this until [customer event]?"],
  ["Price the small job on its own page","Scope, price and a ready-by date, at your normal rates."],
  ["Check the old price before you bring it back","If the full job’s price is more than 60 days old, the Owner decides whether to hold it or reprice."]]},
 "2.1":{t:"Make one useful contact",why:"Another message like the last ones will get the same result. Change the channel and the subject: ask about their business, not your proposal.",o:[
  ["Call or stop by with a business question","Find something real first: an event, a busy season, an inspection, a move.","I’m not calling to chase the proposal. With [what’s coming up for them], which spaces matter most?"],
  ["Try once more a week later","If nothing comes back, send one note saying you’ll close the file for now and check back next quarter. Then do that."],
  ["Send one short, honest note","Either answer helps.","Is [project] still something you want to do, or have your priorities changed? Either answer helps us plan.","W"]]},
 "2.2":{t:"Check whether the silence has a reason",why:"If a known approval or budget process is still underway, waiting may be right. This applies when there is no credible update.",o:[
  ["Reread the last conversation","Note what they said would happen and when. If a process is underway, wait for it."],
  ["Find something real to ask about","An event on their calendar, a busy season, an inspection, a move."],
  ["Make it safe to say no","Say it once, plainly.","If the project is off the table for now, it’s fine to tell me. I’d rather know."]]},
 "3.1":{t:"Learn what changed",why:"When the conversation is warm, ask about the project once, plainly. A frozen budget rarely freezes every dollar.",o:[
  ["Ask what changed since you last spoke","Listen before offering a solution.","What changed since we last spoke, and what would need to happen for this to move ahead?"],
  ["Ask if the hold is on everything","Repair money often keeps moving when capital stops.","Is the hold on everything, or on capital projects?"],
  ["Ask what people notice most","Points you to the work that still matters.","Which spaces do your customers, tenants or visitors notice most?"]]},
 "3.2":{t:"Sort what you know from what you assume",why:"Before you push again, separate what the customer told you from what you believe. Silence alone doesn’t prove a loss.",o:[
  ["Review the job again in two weeks","If nothing has changed, decide to pause or close, with the evidence."],
  ["Write down what is confirmed","What the customer said, what the proposal says, and what you only believe. Mark the rest UNKNOWN."],
  ["Ask if someone else now handles it","Ask your contact. Don’t go around them.","Has someone else taken this over on your side?"]]},
 "3.3":{t:"Name the one fact you most need",why:"Pick the single missing fact that matters most, usually whether the project is still planned, and ask one question about it.",o:[
  ["Ask if the project is still planned","Write down their answer.","Is this still planned for this year, or has it moved?"],
  ["Ask what would make it worth revisiting","Their answer is your next date.","What would need to happen for this to be worth revisiting?"],
  ["Write the gap down, or NONE","One gap and one question. If nothing important is missing, write NONE."]]},
 "4.2":{t:"Ask your contact to proceed, pause or close",why:"Your contact may be the one who has to say it’s off. Make that easy, and agree who approves it if it goes ahead.",o:[
  ["Ask them to choose","Each answer is a real next step.","Should we plan the next step, put this on hold, or close our estimate?"],
  ["Ask who can approve a small job","Many managers can sign small repairs alone.","Who can approve something this size? Is that within your budget?"],
  ["Ask what would bring it back","Write down the event and the date.","If it’s on hold, what would make it worth revisiting, and when?"]]},
 "5.1":{t:"Learn when the project could restart",why:"If the money is on hold, find out until when and who puts it back on the list.",o:[
  ["Ask how long the hold lasts","Write it down in their words.","How long is the hold, and what is still open?"],
  ["Ask who puts projects back on the list","That person and date are your next step.","Who decides when this comes back, and when do they decide?"],
  ["No date? Write UNKNOWN and set your own","Put your own review date on the calendar. Never pass it off as theirs."]]},
 "6.1":{t:"Agree to proceed, pause or close",why:"Each of the three is a real next step. Record which one, who owns it and their date, or UNKNOWN.",o:[
  ["Ask which it is","Write their answer in their words.","Should we plan the next step, put this on hold, or close our estimate?"],
  ["If paused, ask when to check back","Put that date on your calendar.","When would you like me to check back?"],
  ["Confirm it in writing","Two lines: proceed, pause or close with their date, then your action and date."]]},
 "6.2":{t:"Record the answer or NO RESPONSE",why:"Write what the customer said, or NO RESPONSE. Then set your own review date. Don’t record a loss you only assumed.",o:[
  ["Two weeks out","Look again. If still nothing, close the file for now and say so."],
  ["One week out, if the price is running out","Or if the Owner has a decision to make."],
  ["Next quarter, if you closed the file","Put the check-back on your calendar, as you told them."]]}
},
nextyear:{
 "1.2":{t:"Phase the job so part can fit sooner",why:"A figure per phase lets the budget fund one at a time. If any money is free this year, a small first phase keeps you in place.",o:[
  ["Ask if part could be done this year","Write down what they say.","Is any money available this year for part of it?"],
  ["Send budget figures by phase","One figure per phase, with how long each holds.","Here are the figures for [work]. The price is valid until [date]. After that we will confirm updated pricing before you approve the work."],
  ["Ask the Owner how to hold the price","If the budget decision falls after your price hold, the Owner decides: hold it, reprice now, or give a range."]]},
 "2.1":{t:"Ask about the budget calendar",why:"“Next year” can mean next month or nine months. Find out when figures are due and when the budget is approved.",o:[
  ["Call and ask about the budget dates","Write down both dates.","When do you need our figures for the budget, and when is that budget normally approved?"],
  ["Ask at your next planned contact","Use this when you already talk on a schedule. If the date passes, call."],
  ["Ask in writing","A note they can answer in one line.","So I can plan around it: when are budget figures due, and when is next year’s budget approved?","W"]]},
 "2.2":{t:"Find out what “next year” means",why:"It can mean the job is already in the draft budget, or that nobody has asked for it yet. Each needs a different move.",o:[
  ["Ask if it’s in a planned budget","Write it down in their words.","Is this being included in a planned budget, or is the timing still undecided?"],
  ["Ask what would put it in","That is your next step.","What would make sure it makes the budget?"],
  ["Ask who would know","Then ask that person, with your contact’s OK.","Who would know when the budget is set? Could I ask them?"]]},
 "3.1":{t:"Give the budget a reason not to wait",why:"Whoever builds the budget will ask why this can’t wait. Help your contact answer, without inventing urgency.",o:[
  ["Make a photo page of the worst areas","Label each one by area."],
  ["List what gets worse if it waits","In plain words. Leave out dollar figures you can’t back up."],
  ["Ask what supports a budget request","Get them that, and nothing extra.","What do they need from us to support the request?"]]},
 "3.2":{t:"Rank the work so phases can be funded",why:"If the budget funds one phase at a time, phase one should be what they most need.",o:[
  ["Walk the site and rank the areas","With your contact. Take photos as you go."],
  ["Rank them from your notes and send it","Ask your contact to confirm the order."],
  ["Ask which they’d fund first","Write down the order and the reasons.","If only part is funded, which part would you do first?"]]},
 "3.3":{t:"Work back from the budget dates",why:"Your figures need to land before the budget is drafted. Put their dates side by side with yours.",o:[
  ["Ask when the draft is due","Write both dates in their words.","When is next year’s budget drafted, and when is it approved?"],
  ["Ask when they’d want work to start","That date is theirs.","If it’s approved, when would you want the work to start?"],
  ["Plan your figures a week before","Put it on your calendar. It is your date, not theirs."]]},
 "4.1":{t:"Find who builds and approves the budget",why:"Your contact may want the work, but someone else puts projects on the list and someone else approves it.",o:[
  ["Ask who puts projects on the list","Write down the name and what they need.","Who puts this project into the budget, and what do they need from us?"],
  ["Ask who approves the budget","Write down when.","Who approves the budget, and when?"],
  ["Ask if it will be bid out once approved","If yes, your figure may set the budget others bid against. Make it complete.","Once it’s approved, will you get other bids?"]]},
 "5.1":{t:"Get the date the budget is decided",why:"Once they have your figures, the customer owns getting it into the budget. Get the date it is decided.",o:[
  ["Ask when they’ll know","Write the date in their words.","Once you have these figures, what happens next on your side, and when will you know?"],
  ["Ask if they need anything else","If not, wait for their date.","Is there anything else you need before the budget decision?"],
  ["No date? Write UNKNOWN and set your own","Put your own review date on the calendar. Never pass it off as theirs."]]},
 "6.1":{t:"Agree who submits it and when",why:"The deal is moving when the customer owns putting it in the budget and gives a date.",o:[
  ["Ask them to put it in the draft","Write down their answer and date.","If I get you the figures by [date], can you put this in the draft budget?"],
  ["Offer a first phase if money is free now","Only if they said some money is available.","Would it help to do [first phase] this year and put the rest in next year’s budget?"],
  ["Confirm it in writing","Their budget step and date, then your action and date."]]},
 "6.2":{t:"Keep their budget dates and yours apart",why:"Their budget deadlines are theirs. Your review date is yours. Put both on the calendar and never mix them up.",o:[
  ["A week before their figures are due","Send updated figures if anything has changed."],
  ["One week out, if your price is running out","Take it to the Owner."],
  ["The day after the budget is approved","Call to ask whether it was approved and who signs."]]}
},
gc:{
 "1.1":{t:"Decide whether to bid, with the Owner",why:"Check the work, the deadline, your capacity and the bid requirements before you price. Over $75,000, or any bond, wage or contract question, goes to the Owner.",o:[
  ["Bring any trigger to the Owner","If one applies, the Owner decides whether to bid."],
  ["Get the complete bid package","Drawings, specifications, addenda and the subcontract terms.","Can you send the complete bid package, painting scope and subcontract requirements?"],
  ["Check your price holds past the award","Write how long your number holds, and check it covers the GC’s expected award date."]]},
 "1.2":{t:"Clarify the painting scope",why:"The scope hides in the specification, the finish schedule and the drawing notes. Ask your questions in writing before the question deadline.",o:[
  ["Read the spec, schedule and drawing notes","Products, coats, who paints doors and frames, working hours, and wage and bond terms."],
  ["Send your questions in writing","Before the question deadline.","On [sheet or section], the finish schedule shows [X] but the specification says [Y]. Which should we price?","W"],
  ["Qualify anything left unanswered","If no addendum answers it, price what the documents say and list the question as a qualification."]]},
 "1.3":{t:"Build a clean, qualified number",why:"GCs compare sub bids line by line. A number with a clear scope sheet often beats a slightly lower one with surprises.",o:[
  ["List inclusions and exclusions on one page","Plus the addenda you priced, by number."],
  ["Price alternates separately","Only if the documents ask for them."],
  ["Get the Owner’s review before it goes out","Anything over $75,000, a bond, or a wage or contract question."]]},
 "2.1":{t:"Confirm you have the latest package",why:"Your last contact with the GC should leave you with every addendum and both deadlines.",o:[
  ["Call the estimator","Write down both deadlines.","Please confirm we have the latest drawings and addenda. When are questions and our number due?"],
  ["Check for new addenda before bid day","Sign in to the plan room so you receive them."],
  ["Ask to be added to the bid list","Send it today.","Can you add us to your bid list and send the full package, including addenda?","W"]]},
 "3.2":{t:"Find the scope question that matters most",why:"Of everything unclear in the documents, pick the one that would change your number most, and get it answered.",o:[
  ["Recheck it after the last addendum","If it is still open, make it a qualification."],
  ["Send it as one written question","Before the question deadline."],
  ["Ask the estimator by phone","Then confirm it in writing.","Which do you want us to price on [item]?"]]},
 "3.3":{t:"Learn the GC’s dates",why:"Your number is due before the GC’s. Know both deadlines, and when the owner awards.",o:[
  ["Ask for the sub bid deadline","Write it down.","When is your deadline for sub bids?"],
  ["Ask when the owner awards","That date is the GC’s, not yours.","When does the owner expect to award, and when do you pick subs?"],
  ["Put both dates on your calendar","Finish your number the day before the sub deadline."]]},
 "4.1":{t:"Know who you’re bidding to",why:"Find out who the owner is, which GCs are bidding, and whether you can bid to each.",o:[
  ["Ask who the owner is","A hard bid is decided mostly on price.","Who is the owner, and is this a hard bid or negotiated?"],
  ["Ask how many GCs are bidding","Each GC that might win is a chance at the work.","How many GCs are bidding, and can we bid to all of them?"],
  ["Get to know each estimator","Outside a live bid. They decide who they call first."]]},
 "4.2":{t:"Make your number easy to carry",why:"The GC’s estimator compares bids on bid day. Make yours the easiest to compare.",o:[
  ["Ask how they want subs to submit","Then send it that way.","What format do you want our number in?"],
  ["Send a one-page scope sheet with it","Inclusions, exclusions, addenda and how long the price holds."],

function parseDay(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"").trim());
  if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return (d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3])?d:null;
}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=d=>WD[d.getDay()]+", "+MO[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
const weekend=d=>d.getDay()===0||d.getDay()===6;
const plusDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const daysBetween=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};
const clock=d=>{try{return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}catch(e){return pad(d.getHours())+":"+pad(d.getMinutes());}};
/* n working days after the start date; a weekend start counts from the following Monday */
function addWorkdays(start,n){
  let d=plusDays(start,0);
  while(weekend(d))d=plusDays(d,1);
  for(let left=n;left>0;){d=plusDays(d,1);if(!weekend(d))left--;}
  return d;
}

/* which master playbook a written playbook came from */

  const p=J&&J.play;
  if(!p||typeof p!=="object")return "";
  const extra=(p.evidence?" "+esc(p.evidence):"")+((p.assumed||[]).length?" "+esc(p.assumed.join(" ")):"");

    ?`<p>The suggestions come from the master playbook for this situation: <b>${esc(p.name)}</b>.${extra}</p>`

function drawStart(){
  const input=$("d0");
  if(!input)return;
  if(input.value!==d0iso())input.value=d0iso();
  $("d0-today").hidden=d0iso()===iso(today());
  let note="Every date below counts working days from this date. Weekends are skipped.";
  if(J){
    const changed=d0iso()!==J.questionnaireDate,ago=daysBetween(d0(),today());
    $("d0-reset").hidden=!changed;
    note+=" "+(changed?"Changed from the questionnaire date, "+fmt(parseDay(J.questionnaireDate))+".":(J.questionnaireDateNote||""));
    if(ago>14)note+=" That was "+ago+" days ago. Working the job today? Use today’s date and every date moves with you.";
  }
  $("d0-note").textContent=note;
  const pl=$("pl"),pln=$("pl-note");
  if(pl){
    if(pl.value!==state.play)pl.value=state.play;
    pln.textContent=state.play
      ?(state.playWhy?"Picked from your answers. "+state.playWhy+" ":"")+"The suggestions below come from this master playbook. Change it if the customer’s situation is different."
      :"Choose the customer’s situation to get that master playbook’s suggestions. Upload the questionnaire and it is chosen for you.";
  }
  const pn=$("pd-note");
  if(pn){
    const p=parseDay(state.pd),n=MASTER.priceDays;
    if(!p){pn.hidden=true;pn.innerHTML="";}
    else{
      const end=plusDays(p,n),over=daysBetween(end,today())>0;
      pn.hidden=false;
      pn.innerHTML=over
        ?`<span class="mv no">Owner decides</span>The proposal’s ${n} days ended ${esc(fmt(end))}. A price more than ${n} days old goes to the Owner. See question 1.`
        :`<span class="mv yes">Price holds</span>The proposal’s ${n} days end ${esc(fmt(end))}.`;
    }
  }
}

/* ── drop-down menus ── */
function ddParts(dd){return {btn:dd.querySelector(".dd-btn"),val:dd.querySelector(".dd-val"),list:dd.querySelector(".dd-list")};}
function closeDD(dd,refocus){
  const p=ddParts(dd);
  if(p.list.hidden)return;
  p.list.hidden=true;dd.classList.remove("open");p.btn.setAttribute("aria-expanded","false");
  if(refocus)p.btn.focus();
}
function closeAll(except){document.querySelectorAll(".dd.open").forEach(dd=>{if(dd!==except)closeDD(dd,false);});}
function openDD(dd,last){
  const p=ddParts(dd);
  if(p.btn.disabled)return;
  closeAll(dd);
  p.list.hidden=false;dd.classList.add("open");p.btn.setAttribute("aria-expanded","true");
  const opts=p.list.querySelectorAll(".dd-opt");
  const pick=p.list.querySelector('.dd-opt[aria-selected="true"]')||(last?opts[opts.length-1]:opts[0]);
  if(pick)pick.focus();
}
function fillDD(dd,placeholder,items,chosen,disabled){
  const p=ddParts(dd);
  p.btn.disabled=!!disabled;
  if(disabled)closeDD(dd,false);
  p.val.textContent=chosen===null?placeholder:items[chosen].label;
  dd.classList.toggle("is-set",chosen!==null);
  p.list.innerHTML=items.map((it,i)=>`<li role="presentation"><button type="button" role="option" class="dd-opt${it.n?"":" plain"}" data-v="${i}" aria-selected="${chosen===i?"true":"false"}">${it.n?`<span class="dd-n" aria-hidden="true">${it.n}</span>`:""}<span class="dd-t">${esc(it.t)}</span><span class="dd-d">${esc(it.d)}</span></button></li>`).join("");
}

/* ── one question: the suggestion, then the option ── */
function sayHTML(o,id){
  return `<section class="say"><div class="say-head"><h4>${esc(o.sayKind||"Say this")}</h4><button type="button" class="pill sm" data-copy="${id}">Copy</button></div><p class="say-text" id="${id}">${esc(o.say)}</p></section>`;
}
function drawQ(qi){
  const q=QS[qi],c=sel(qi);
  const sd=$("sd"+qi),od=$("od"+qi),qn=$("qn"+qi);
  if(!sd)return;
  fillDD($("s"+qi),"Choose a suggestion",q.suggestions.map((s,i)=>({n:i+1,t:s.t,label:(i+1)+". "+s.t,d:"Do by "+fmt(dayFor(sugBy(s)))})),c.s,false);
  qn.textContent=c.o!==null?"✓":String(qi+1);
  qn.classList.toggle("done",c.o!==null);
  if(c.s===null){
    sd.innerHTML=`<p class="hint">Three suggestions for this answer. Choose the one that fits best.</p>`;
    fillDD($("o"+qi),"Choose a suggestion first",[],null,true);
    od.innerHTML="";
    return;
  }
  const sug=q.suggestions[c.s];
  sd.innerHTML=`<p>${esc(sug.why)}</p><p class="by">Do this by <b>${esc(fmt(dayFor(sugBy(sug))))}</b>.</p>`;
  fillDD($("o"+qi),"Choose an option",sug.options.map(o=>({t:o.t,label:o.t,d:fmt(dayFor(o.d))})),c.o,false);
  if(c.o===null){
    od.innerHTML=`<p class="hint">Three ways to do it. Choose one to get the date for your calendar.</p>`;
    return;
  }
  const o=sug.options[c.o],d=dayFor(o.d);
  od.innerHTML=`<div class="opt">${calTab(d)}<div class="opt-body"><p class="put">Put it on your calendar for <b>${esc(fmt(d))}</b>.${o.note?` <span class="note">${esc(o.note)}</span>`:""}</p><p>${esc(o.do)}</p>${o.say?sayHTML(o,"say-"+qi):""}</div></div>`;
}
function choose(qi,kind,v){
  const cur=sel(qi);
  if(kind==="s")state.sel[qi]={s:v,o:cur.s===v?cur.o:null};
  else state.sel[qi]={s:cur.s,o:v};
  save();drawQ(qi);drawPlan();
}

/* ── the calendar built from the choices ── */
function planItems(){
  const firm=[],open=[];
  QS.forEach((q,qi)=>{
    const c=sel(qi);
    if(c.s===null)return;
    const sug=q.suggestions[c.s];
    if(c.o===null)open.push({qi:qi,sug:sug,date:dayFor(sugBy(sug))});
    else firm.push({qi:qi,sug:sug,opt:sug.options[c.o],date:dayFor(sug.options[c.o].d)});
  });
  firm.sort((a,b)=>a.date-b.date||a.qi-b.qi);
  return {firm:firm,open:open};
}
function drawPlan(){
  const body=$("plan-body");
  if(!body)return;
  const p=planItems(),total=QS.length,any=p.firm.length||p.open.length;
  $("plan-count").textContent=p.firm.length+" of "+total+" questions have a date";
  $("plan-copy").hidden=!any;
  $("plan-ics").hidden=!p.firm.length||hasClaude;   /* a calendar file cannot be saved from inside Claude */
  $("plan-reset").hidden=J?!any:isBlank();
  if(!any){
    body.innerHTML=`<p class="hint">Nothing chosen yet. Choose a suggestion and an option under any question, and its date shows up here.</p>`;
    return;
  }
  const groups=[];
  p.firm.forEach(it=>{
    const k=iso(it.date);
    if(!groups.length||groups[groups.length-1].k!==k)groups.push({k:k,date:it.date,items:[]});
    groups[groups.length-1].items.push(it);
  });
  let h="";
  if(groups.length){
    h+=`<ol class="plan-days">${groups.map(g=>`<li class="plan-day">${calTab(g.date,true)}<ul class="plan-items">${g.items.map(it=>
      `<li><b>${esc(it.opt.t)}</b><span class="plan-ctx">Question ${it.qi+1}: ${esc(it.sug.t)}</span></li>`).join("")}</ul></li>`).join("")}</ol>`;
    const cn=J?J.calendarNote:"Calls to the same person that land on the same day can be one call.";
    if(cn&&p.firm.length>1)h+=`<p class="hint">${esc(cn)}</p>`;
  }
  if(p.open.length){
    h+=`<div class="plan-open"><h3>Still needs an option</h3><ul>${p.open.map(it=>
      `<li>Question ${it.qi+1}: ${esc(it.sug.t)}. Do by ${esc(fmt(it.date))}.</li>`).join("")}</ul></div>`;
  }
  body.innerHTML=h;
}

/* ── calendar file: one all-day entry per choice ── */
function icsText(){
  const escI=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const enc=new TextEncoder();
  const fold=line=>{
    const out=[];let cur="",bytes=0;
    for(const ch of line){
      const n=enc.encode(ch).length;
      if(bytes+n>73){out.push(cur);cur=" ";bytes=1;}
      cur+=ch;bytes+=n;
    }
    out.push(cur);
    return out.join("\r\n");
  };
  const ymd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const now=new Date(),title=jobTitle(),uid=J?J.id:"job";
  const stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+"Z";
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Whats Next and When//Questionnaire Action Page//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  planItems().firm.forEach(it=>{
    const desc="Question "+(it.qi+1)+": "+QS[it.qi].q+"\nSuggestion: "+it.sug.t+"\nDo: "+it.opt.do+(it.opt.say?"\n"+sayWord(it.opt)+": "+it.opt.say:"")+(it.opt.note?"\nNote: "+it.opt.note:"");
    lines.push("BEGIN:VEVENT","UID:"+uid+"-q"+(it.qi+1)+"-"+ymd(it.date)+"-"+stamp+"@whats-next-and-when","DTSTAMP:"+stamp,
      "DTSTART;VALUE=DATE:"+ymd(it.date),"DTEND;VALUE=DATE:"+ymd(plusDays(it.date,1)),
      "SUMMARY:"+escI((title?title+": ":"")+it.opt.t),"DESCRIPTION:"+escI(desc),"TRANSP:TRANSPARENT","END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n")+"\r\n";
}

/* ── copy, download, clear ── */
function flash(btn,msg){
  if(!btn.dataset.label)btn.dataset.label=btn.textContent;
  btn.textContent=msg;
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{btn.textContent=btn.dataset.label;},2400);
}
function copyText(text,btn,el){
  const fallback=()=>{
    try{
      const r=document.createRange();r.selectNodeContents(el);
      const s=window.getSelection();s.removeAllRanges();s.addRange(r);
      flash(btn,"Selected. Copy with your keyboard");
    }catch(e){flash(btn,"Copy isn’t available here");}
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>flash(btn,"Copied"),fallback);}
    else fallback();
  }catch(e){fallback();}
}
/* hand the reader a file. Inside Claude the page asks Claude to save it and the reader confirms.
   Anywhere else the browser downloads it; inside some other page's frame that can be blocked without notice. */
async function saveBlob(name,blob,btn){
  if(hasClaude){
    flash(btn,"Getting it ready");
    const d=await pDownloads;
    if(d){
      try{await d.save({filename:name,data:blob});flash(btn,"Saved");}
      catch(e){
        const c=e&&e.code;
        flash(btn,c==="declined"?"Download cancelled":(c==="rate_limited"?"Try again in a moment":"Download isn’t available here"));
      }
      return;
    }
  }
  try{
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    flash(btn,"Download started");
    if(framed){
      const h=btn.parentNode&&btn.parentNode.querySelector(".dl-hint");
      if(h){h.hidden=false;h.textContent="Nothing downloaded? Open this file in your web browser and use the button there.";}
    }
  }catch(e){flash(btn,"Download isn’t available here");}
}
function downloadIcs(btn){

function pageSource(){
  const app=$("app").textContent;
  const jS="/*JOB-"+"START*/",jE="/*JOB-"+"END*/",sS="/*SAVED-"+"START*/",sE="/*SAVED-"+"END*/";
  const ja=app.indexOf(jS),jb=app.indexOf(jE,ja),sa=app.indexOf(sS,jb),sb=app.indexOf(sE,sa);

  };
  return SHELL.replace(/\{\{(TITLE|STYLES|LOGO|PDF|SCRIPT)\}\}/g,(m,k)=>parts[k]);
}

/* a .docx is a zip file; this reads the parts that hold the text */
async function inflateRaw(u8){
  if(typeof DecompressionStream==="undefined")throw new Error("old-browser");
  return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
}
async function unzip(buf,wanted){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error("not-zip");
  const count=dv.getUint16(eocd+10,true),out={};
  let off=dv.getUint32(eocd+16,true);
  for(let n=0;n<count&&off+46<=u8.length;n++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nlen));
    if(wanted.indexOf(name)>=0){
      const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true),data=u8.subarray(start,start+csize);
      out[name]=method===0?new TextDecoder().decode(data):await inflateRaw(data);
    }
    off+=46+nlen+elen+clen;
  }
  return out;
}
const WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
function docxParts(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const body=doc.getElementsByTagNameNS(WNS,"body")[0];
  const lines=[],rows=[];
  if(!body)return {text:"",rows:rows};
  const pText=p=>{
    let s="";
    const walk=n=>{for(let c=n.firstChild;c;c=c.nextSibling){
      if(c.nodeType!==1)continue;
      if(c.localName==="Fallback")continue;
      if(c.localName==="t")s+=c.textContent;
      else if(c.localName==="tab")s+="\t";
      else if(c.localName==="br"||c.localName==="cr")s+="\n";
      else walk(c);
    }};
    walk(p);return s.trim();
  };
  const block=parent=>{for(let el=parent.firstChild;el;el=el.nextSibling){
    if(el.nodeType!==1)continue;
    if(el.localName==="p"){const t=pText(el);if(t)lines.push(t);}
    else if(el.localName==="tbl"){
      Array.prototype.forEach.call(el.getElementsByTagNameNS(WNS,"tr"),tr=>{
        const cells=[];
        for(let tc=tr.firstChild;tc;tc=tc.nextSibling){
          if(tc.nodeType===1&&tc.localName==="tc")cells.push(Array.prototype.map.call(tc.getElementsByTagNameNS(WNS,"p"),pText).filter(Boolean).join("\n"));
        }
        if(cells.some(Boolean)){rows.push(cells);lines.push(cells.join(" | "));}
      });
    }
    else if(el.localName==="sdt"||el.localName==="sdtContent")block(el);
  }};
  block(body);
  return {text:lines.join("\n"),rows:rows};
}
const squash=s=>String(s||"").replace(/\s+/g," ").trim().toLowerCase();
/* the six answers, from the questionnaire's table: a row that starts with 1 to 6 */
function questionnaireAnswers(rows){
  const out={};
  rows.forEach(cells=>{
    const n=/^\s*([1-6])\s*[.)]?\s*$/.exec(cells[0]||"");
    if(!n||cells.length<2)return;
    const qi=+n[1]-1,q=squash(MASTER.questions[qi].q);
    const partsOut=[];
    cells.slice(1).forEach(c=>{
      /* the question's own wording is not part of the answer; anything typed after it is */
      const lines=String(c).split("\n").filter(l=>squash(l)&&squash(l)!==q&&!(q.indexOf(squash(l))===0&&squash(l).length>12));
      const t=lines.join("\n").trim();
      if(t)partsOut.push(t);
    });
    out[qi]=partsOut.join("\n");
  });
  return out;
}
/* PDF text needs a reading library, loaded only when a PDF is uploaded */
const PDF_HOSTS=["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/","https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/"];
function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>{s.remove();rej(new Error("load"));};document.head.appendChild(s);});
}
let pdfReady=null;
function pdfLib(){
  if(!pdfReady){
    const from=host=>loadScript(host+"pdf.worker.min.js").then(()=>loadScript(host+"pdf.min.js")).then(()=>{if(!window.pdfjsLib)throw new Error("load");return window.pdfjsLib;});
    pdfReady=from(PDF_HOSTS[0]).catch(()=>from(PDF_HOSTS[1])).catch(e=>{pdfReady=null;throw e;});
  }
  return pdfReady;
}
async function pdfParts(buf){
  const lib=await pdfLib();
  const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true,useSystemFonts:false}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    let s="",lastY=null;
    tc.items.forEach(it=>{
      if(typeof it.str!=="string")return;
      const y=it.transform?Math.round(it.transform[5]):null;
      if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2){if(s&&!s.endsWith("\n"))s+="\n";}
      else if(s&&!/\s$/.test(s)&&it.str&&!/^\s/.test(it.str))s+=" ";
      s+=it.str;
      if(it.hasEOL&&!s.endsWith("\n"))s+="\n";
      if(y!==null)lastY=y;
    });
    pages.push(s.replace(/[ \t]+\n/g,"\n").trim());
  }
  return {text:pages.join("\n\n"),pages:doc.numPages};
}
async function readFile(file){
  const name=file.name||"document",ext=(name.split(".").pop()||"").toLowerCase();
  const item={name:name,kind:"other",text:"",saved:"",pages:0,answers:null,err:""};
  try{
    if(ext==="docx"){
      const parts=await unzip(await file.arrayBuffer(),["word/document.xml","docProps/core.xml"]);
      if(!parts["word/document.xml"])throw new Error("not-word");
      const d=docxParts(parts["word/document.xml"]);
      item.text=d.text;
      const m=/<dcterms:modified[^>]*>(\d{4}-\d{2}-\d{2})/.exec(parts["docProps/core.xml"]||"");
      if(m)item.saved=m[1];
      const ans=questionnaireAnswers(d.rows);
      if(Object.keys(ans).length>=4||/csa opportunity prep/i.test(d.text)){item.kind="questionnaire";item.answers=ans;}
      if(!item.text.trim())item.err="No text was found in this file.";
    }else if(ext==="pdf"){
      const d=await pdfParts(await file.arrayBuffer());
      item.text=d.text;item.pages=d.pages;item.kind="proposal";
      if(!item.text.trim())item.err="No text could be read from this PDF. It may be a scan.";
    }else{
      item.err=ext==="doc"?"Older .doc files can’t be read. Save it as .docx in Word and upload that.":"Only Word (.docx) and PDF files can be read.";
    }
  }catch(e){
    const m=e&&e.message;
    item.err=m==="old-browser"?"This browser can’t open Word files. Try a current version of Chrome, Edge, Safari or Firefox."
      :(m==="load"?"The PDF reader could not be loaded. Check your internet connection and try again.":"This file could not be read.");
  }
  return item;
}

  const qShape='{"answer":"","proposal":"","unknown":"","suggestions":[{"t":"","why":"","options":[{"t":"","do":"","say":"","sayKind":""},{"t":"","do":""},{"t":"","do":""}]},{"t":"","why":"","options":[3 options]},{"t":"","why":"","options":[3 options]}]}';
  return [

/* phone numbers, email and web addresses and job numbers are not needed to write a playbook */
const noContacts=s=>String(s).replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,"").replace(/\bhttps?:\/\/\S+/gi,"").replace(/\bwww\.\S+/gi,"")
  .replace(/\(?\b\d{3}\)?[\s.-]{1,3}\d{3}[\s.-]{1,3}\d{4}\b/g,"").replace(/\bJOB-[\d-]+\b/gi,"").replace(/\s-\d{3,5}-\d{3,5}\b/g,"")
  .replace(/^[ \t]*(?:[MEPCO]:)?[ \t]*$/gm,"").replace(/\n{3,}/g,"\n\n");
/* the documents as one block of text, kept inside what one request can carry */
function docsText(docs){
  const order={questionnaire:0,proposal:1,other:2};
  const list=docs.slice().sort((a,b)=>order[a.kind]-order[b.kind]);
  let left=150000,cut=0;
  const text=list.map((p,i)=>{
    const full=noContacts(p.text);
    const room=Math.max(0,Math.min(60000,left)),t=full.length>room?(cut++,full.slice(0,room)+"\n[The rest of this document was left out because it is long.]"):full;
    left-=Math.min(full.length,room);
    return "=== DOCUMENT "+(i+1)+": "+KINDS[p.kind]+(p.saved?" (file saved "+p.saved+")":"")+" ===\n"+t;
  }).join("\n\n");
  return {text:text,cut:cut};
}
const str=v=>(typeof v==="string"?v:(v==null?"":String(v))).trim();
/* nothing that should stay out of a playbook gets through, whatever came back */
const scrub=s=>noContacts(str(s)).replace(/\bFBCs?\b/g,"CSA or Owner").replace(/[ \t]{2,}/g," ").trim();
/* dollar figures in what Claude wrote that are neither in the documents nor a total of figures that are */
const MONEY=/\$\s?\d[\d,]*(?:\.\d+)?\s?[kK]?\b/g;
function cents(x){
  const m=/\$\s?(\d[\d,]*(?:\.\d+)?)\s?([kK])?/.exec(x);
  if(!m)return 0;
  const n=parseFloat(m[1].replace(/,/g,""))*(m[2]?1000:1);
  return isFinite(n)?Math.round(n*100):0;
}
function moneyToCheck(written,docs){
  const inDocs=Array.from(new Set((docs.map(p=>p.text).join("\n").match(MONEY)||[]).map(cents).filter(v=>v>0))).sort((a,b)=>b-a);
  const sums=new Set([0]);
  inDocs.slice(0,16).forEach(v=>{Array.from(sums).forEach(t=>sums.add(t+v));});
  const seen=new Set(),out=[];
  (written.match(MONEY)||[]).forEach(x=>{
    const v=cents(x);
    if(!v||seen.has(v))return;
    seen.add(v);
    if(inDocs.indexOf(v)<0&&!sums.has(v))out.push(x.trim().replace(/[.,]$/,""));
  });
  return out;
}
function assembleJob(head,parts,docs,play){
  const qs=[],pid=play&&play.id?play.id:null;
  parts.forEach((p,g)=>{
    const arr=p&&Array.isArray(p.questions)?p.questions:null;
    if(!arr||arr.length!==GROUPS[g].length)throw new Error("shape");
    arr.forEach((q,k)=>{
      const qi=GROUPS[g][k],m=MASTER.questions[qi];
      if(!q||!Array.isArray(q.suggestions)||q.suggestions.length!==3)throw new Error("shape");
      qs.push({
        answer:scrub(q.answer)||"No answer given.",proposal:scrub(q.proposal),unknown:scrub(q.unknown),
        suggestions:q.suggestions.map((s,si)=>{
          if(!s||!Array.isArray(s.options)||s.options.length!==3||!str(s.t)||!str(s.why))throw new Error("shape");
          /* src: the master step this suggestion was written from. Day counts stay the master's. */
          return {t:scrub(s.t),why:scrub(s.why),src:refLabel(slotRef(pid,qi,si)),options:s.options.map((o,oi)=>{
            if(!o||!str(o.t)||!str(o.do))throw new Error("shape");
            const mo=m.suggestions[si].options[oi],r={t:scrub(o.t),d:mo.d,do:scrub(o.do)};
            if(str(o.say)){r.say=scrub(o.say).replace(/^["“]+|["”]+$/g,"");if(str(o.sayKind)==="Write this"||mo.sayKind==="Write this")r.sayKind="Write this";}
            if(str(o.note))r.note=scrub(o.note);
            return r;
          })};
        })
      });
    });
  });
  const h=(head&&typeof head==="object")?head:{},f=h.facts||{};
  const shortName=cleanName(h.shortName)||cleanName(h.title)||"New job";
  const title=scrub(h.title).replace(/[_]+/g," ")||shortName;
  const qDoc=docs.find(p=>p.kind==="questionnaire");
  let qd=qDoc&&parseDay(qDoc.saved)?qDoc.saved:"",note="This is the day the questionnaire file was saved.";
  if(!qd){qd=iso(today());note="The questionnaire file carries no date, so the day the playbook was written is used.";}
  const others=docs.filter(p=>p.kind==="other").length,now=new Date();
  const factsOut=[["Customer",scrub(f.customer)||"UNKNOWN"],["Estimate",scrub(f.estimate)||"UNKNOWN"],["Proposal",scrub(f.proposal)||"UNKNOWN"]];
  const verify=moneyToCheck(JSON.stringify([factsOut,qs]),docs);
  return {
    id:"job-"+shortName.toLowerCase().replace(/\s+/g,"-"),
    fileName:shortName+" Playbook Simple Version",
    calendarFile:shortName+" Calendar.ics",
    title:title,tag:"Simple version playbook",
    facts:factsOut,
    questionnaireDate:qd,questionnaireDateNote:note,calendarNote:scrub(h.calendarNote),
    stamp:"Written by Claude on "+fmt(now)+" at "+clock(now)+" from the uploaded questionnaire"+(docs.some(p=>p.kind==="proposal")?", the proposal":"")+(others?" and "+others+" other "+(others===1?"document":"documents"):"")+". Check it against the proposal before you rely on it.",
    written:true,verify:verify,
    play:{id:pid,name:play?play.name:"",why:play?play.why:"",evidence:play?play.evidence:"",assumed:play?play.assumed:[]},
    questions:qs
  };
}
const AI_COPY={
  rate_limited:"Claude is busy, or you have reached a usage limit. Wait a few minutes and try again.",
  session_expired:"Sign in to Claude again, then try again.",
  prompt_too_large:"These documents are too long to read at once. Upload fewer or shorter documents.",
  refused:"Claude declined to write from these documents.",
  invalid_json:"The playbook did not come back complete. Try again.",
  empty_completion:"The playbook did not come back complete. Try again.",
  shape:"The playbook did not come back complete. Try again."
};
const AI_GONE=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
function useFallback(why){
  const ok=fillFromDocs();
  upBusy=null;
  if(ok&&!anyAns())upMsg={kind:"warn",text:(why?why+" ":"")+"No answers were found in the questionnaire, so there was nothing to fill in. Type the answers below, or upload the completed questionnaire."};
  else upMsg=ok?{kind:"ok",text:(why?why+" ":"")+"The six answers and the dates are filled in below from your documents. Check the job name and the dates. "+(state.play?"The suggestions come from the master playbook “"+playName(state.play)+"”, chosen from your answers. Change it under Master playbook if the customer’s situation is different.":"None of the master playbooks clearly fits the answers, so the suggestions are the standard ones. Choose the customer’s situation under Master playbook if you know it.")}
    :{kind:"warn",text:why||"Add the completed CSA questionnaire first."};
  renderMain();
}
async function buildPlaybook(){
  const docs=goodDocs();
  if(!docs.some(p=>p.kind==="questionnaire")||upBusy)return;
  const sample=await pSample;
  if(!sample){useFallback(hasClaude?"Claude is not available on this page.":"");return;}
  upBusy="writing";upMsg=null;upDone=0;
  upCtls=Array.from({length:PARTS},()=>new AbortController());
  drawUpload();
  const stopAll=()=>upCtls.forEach(c=>{try{c.abort();}catch(x){}});
  try{
    const ask=(i,prompt)=>sample.json(prompt,{signal:upCtls[i].signal,cache:false}).then(v=>{
      upDone++;const el=$("up-prog");if(el)el.textContent=progText();return v;
    });
    /* the first request also asks the reader's permission, so it goes alone. It answers the master's
       selector, which gives the playbook for the job. The three parts then go together. */
    const head=await ask(0,promptSelect(docs));
    if(!head||typeof head!=="object")throw new Error("shape");
    const play=playFrom(head);
    const parts=await Promise.all(GROUPS.map((_,g)=>ask(g+1,promptFor(g,docs,play))));
    const job=assembleJob(head,parts,docs,play);
    if(docsText(docs).cut)job.cutNote=true;
    try{localStorage.setItem(LIVE_KEY,JSON.stringify({job:job}));}catch(e){}
    upBusy=null;picked=[];upMsg=null;
    boot(job,true);
    window.scrollTo(0,0);
  }catch(e){
    const code=(e&&e.code)||(e&&e.message)||"";
    stopAll();
    if(AI_GONE.indexOf(code)>=0){aiState="none";useFallback("Claude is not available on this page.");return;}
    upBusy=null;
    upMsg=code==="cancelled"?{kind:"warn",text:"Stopped. Nothing was written."}
      :{kind:"warn",text:AI_COPY[code]||"Claude could not finish the playbook just now. Try again in a few minutes."};
    drawUpload();
  }
}
window.__wnwPrompt=(g,head)=>g<0?promptSelect(goodDocs()):promptFor(g,goodDocs(),playFrom(head||{}));

/* ── events ── */
document.addEventListener("click",e=>{
  const t=e.target instanceof Element?e.target:null;
  if(!t)return;
  const share = t.closest("[data-share-job]");
  if (share) { sharePlaybook(share); return; }
  const nav = t.closest('a[href="#menus"],a[href="#full-list"]');
  if (nav && hosted) {
    e.preventDefault();
    history.replaceState(history.state, "", nav.getAttribute("href"));
    route(); window.scrollTo(0,0); return;
  }
  const opt=t.closest(".dd-opt");
  if(opt){
    const dd=opt.closest(".dd");
    closeDD(dd,true);
    choose(Number(dd.dataset.q),dd.dataset.kind,Number(opt.dataset.v));
    return;
  }
  const btn=t.closest(".dd-btn");
  if(btn){
    const dd=btn.closest(".dd");
    if(dd.classList.contains("open"))closeDD(dd,false);else openDD(dd,false);
    return;
  }
  closeAll(null);
  const cp=t.closest("[data-copy]");
  if(cp){const el=$(cp.dataset.copy);if(el)copyText(el.textContent,cp,el);return;}
  const dl=t.closest("[data-dl]");
  if(dl){if(dl.dataset.dl==="pdf")downloadPdf(dl);else downloadPage(dl);return;}
  const ux=t.closest("[data-up-x]");
  if(ux){if(!upBusy){picked.splice(Number(ux.dataset.upX),1);upMsg=null;drawUpload();}return;}
  if(t.closest("#up-pick")){if(!upBusy)upInput.click();return;}
  if(t.closest("#up-build")){buildPlaybook();return;}
  if(t.closest("#up-stop")){upCtls.forEach(c=>{try{c.abort();}catch(x){}});return;}
  if(t.closest("#live-new")){try{localStorage.removeItem(LIVE_KEY);}catch(x){}picked=[];upMsg=null;boot(JOB,false);window.scrollTo(0,0);return;}
  if(t.closest("#d0-today")){const now=iso(today());state.d0=(now===baseIso())?null:now;save();drawAll();return;}
  if(t.closest("#d0-reset")){state.d0=null;save();drawAll();return;}
  const pc=t.closest("#plan-copy");
  if(pc){copyText(planText(),pc,$("plan-body"));return;}
  const pi=t.closest("#plan-ics");
  if(pi){downloadIcs(pi);return;}
  const rs=t.closest("#plan-reset");
  if(rs){handleReset(rs);return;}
  if(t.closest("#print-btn")){try{window.print();}catch(err){}}
});
document.addEventListener("keydown",e=>{
  const t=e.target instanceof Element?e.target:null;
  const dd=t&&t.closest(".dd");
  if(!dd)return;
  if(t.classList.contains("dd-btn")){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();openDD(dd,e.key==="ArrowUp");}
    else if(e.key==="Escape"){closeDD(dd,false);}
    return;
  }
  if(t.classList.contains("dd-opt")){
    const opts=Array.prototype.slice.call(dd.querySelectorAll(".dd-opt")),i=opts.indexOf(t);
    if(e.key==="ArrowDown"){e.preventDefault();opts[Math.min(opts.length-1,i+1)].focus();}
    else if(e.key==="ArrowUp"){e.preventDefault();opts[Math.max(0,i-1)].focus();}
    else if(e.key==="Home"){e.preventDefault();opts[0].focus();}
    else if(e.key==="End"){e.preventDefault();opts[opts.length-1].focus();}
    else if(e.key==="Escape"){e.preventDefault();closeDD(dd,true);}
    else if(e.key==="Tab"){closeDD(dd,false);}
  }
});
document.addEventListener("focusin",e=>{
  const t=e.target instanceof Element?e.target:null;
  const dd=t&&t.closest(".dd");
  closeAll(dd||null);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t instanceof HTMLTextAreaElement&&t.dataset.ans!==undefined){
    state.ans[t.dataset.ans]=t.value;save();grow(t);drawPlan();
  }else if(t instanceof HTMLInputElement&&t.id==="jn"){
    state.name=t.value;save();drawPlan();
    if(!J&&SAVED){const h=$("band-h1"),p=document.querySelector(".band .tag");if(h)h.textContent=pageH1();if(p)p.textContent=pageTag();}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t instanceof HTMLSelectElement&&t.id==="pl"){
    /* a different playbook gives different suggestions, so earlier choices are cleared */
    state.play=PLAY_SUG[t.value]?t.value:"";state.playWhy="";state.sel={};save();buildQS();renderMain();
    const s=$("pl");if(s)s.focus();
    return;
  }
  if(!(t instanceof HTMLInputElement))return;
  if(t.id==="d0"&&parseDay(t.value)){state.d0=(t.value===baseIso())?null:t.value;save();drawAll();}
  else if(t.id==="pd"){state.pd=parseDay(t.value)?t.value:"";save();drawStart();drawPlan();}
});
/* dropping files on the upload box */
document.addEventListener("dragover",e=>{
  const t=e.target instanceof Element?e.target.closest("#upload"):null;
  if(t){e.preventDefault();t.classList.add("over");}
});
document.addEventListener("dragleave",e=>{
  const t=e.target instanceof Element?e.target.closest("#upload"):null;
  if(t&&!t.contains(e.relatedTarget))t.classList.remove("over");
});
document.addEventListener("drop",e=>{
  const t=e.target instanceof Element?e.target.closest("#upload"):null;
  if(!t)return;
  e.preventDefault();t.classList.remove("over");

});
